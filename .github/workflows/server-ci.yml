name: Rust server

# Checks for the Rust rewrite under apps/server (see RUST_REWRITE.md and
# apps/server/AGENTS.md): the Rust workspaces, the route inventory and proxy
# config, the Django schema the Rust code has to match, the differential tests
# that need a real database or Redis (permission oracle, throttle interop), and
# licence headers.
#
# The Rust crates are being added crate by crate, so the steps that need a
# crate (the plane-api release build, the database-backed and Redis-backed
# differential tests) are guarded by a file-existence check and are skipped,
# not failed, until the crate lands. The fmt/clippy/test steps of the main
# workspace are guarded the same way because Cargo errors out on a virtual
# workspace with no members.

on:
  workflow_dispatch:
  pull_request:
    branches:
      - "preview"
    types:
      - "opened"
      - "synchronize"
      - "ready_for_review"
      - "review_requested"
      - "reopened"
    paths:
      - "apps/server/**"
      - ".github/workflows/server-ci.yml"
  push:
    branches:
      - "preview"
    paths:
      - "apps/server/**"
      - ".github/workflows/server-ci.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust fmt, clippy and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v6

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Both workspaces in one step: `workspaces` takes newline-separated
      # `$workspace -> $target` entries. plane-testkit is a separate Cargo
      # workspace on purpose (see apps/server/Cargo.toml), so it has its own
      # target directory and lockfile.
      - name: Cache Rust build output
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/server -> target
            apps/server/crates/plane-testkit -> target

      - name: Detect server workspace members
        id: server-workspace
        working-directory: apps/server
        run: |
          if cargo metadata --no-deps --format-version 1 | grep -q '"workspace_members":\[\]'; then
            echo "has-members=false" >> "$GITHUB_OUTPUT"
            echo "::notice::apps/server has no member crates yet; skipping fmt, clippy and test."
          else
            echo "has-members=true" >> "$GITHUB_OUTPUT"
          fi

      # AGENTS.md requires `cargo clippy --workspace --all-targets` from
      # apps/server, so it is run with --all-targets here as well as for the
      # testkit workspace.
      - name: Format (server)
        if: steps.server-workspace.outputs.has-members == 'true'
        working-directory: apps/server
        run: cargo fmt --all --check

      - name: Clippy (server)
        if: steps.server-workspace.outputs.has-members == 'true'
        working-directory: apps/server
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test (server)
        if: steps.server-workspace.outputs.has-members == 'true'
        working-directory: apps/server
        run: cargo test --workspace

      # The release profile is what ships: fat LTO, one codegen unit, panic
      # abort. Building it catches profile-only breakage (for example a panic
      # strategy incompatible with a dependency).
      - name: Build plane-api (release)
        # Two file checks, not one: a crate is "there" only once its manifest
        # and its entry point are. The manifest alone exists while a crate is
        # being written and Cargo would fail on it.
        if: >-
          hashFiles('apps/server/bins/plane-api/Cargo.toml') != '' &&
          hashFiles('apps/server/bins/plane-api/src/main.rs') != ''
        working-directory: apps/server
        run: cargo build --release -p plane-api

      # plane-testkit has its own manifest; --manifest-path keeps cargo from
      # walking up into the server workspace, which excludes it.
      - name: Format (plane-testkit)
        working-directory: apps/server
        run: cargo fmt --all --check --manifest-path crates/plane-testkit/Cargo.toml

      - name: Clippy (plane-testkit)
        working-directory: apps/server
        run: cargo clippy --workspace --all-targets --manifest-path crates/plane-testkit/Cargo.toml -- -D warnings

      - name: Test (plane-testkit)
        working-directory: apps/server
        run: cargo test --workspace --manifest-path crates/plane-testkit/Cargo.toml

  schema:
    name: Django schema and Rust DB tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    services:
      # Same versions as docker-compose-test.yml and apps/server/dev/compose.yml.
      postgres:
        image: postgres:15.7-alpine
        env:
          POSTGRES_USER: plane
          POSTGRES_PASSWORD: plane
          POSTGRES_DB: plane_ci
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U plane -d plane_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      valkey:
        image: valkey/valkey:7.2.11-alpine
        ports:
          - "6379:6379"
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      # The minimal Django environment from apps/server/dev/django-env.sh.
      # There is no MinIO or RabbitMQ service here: `migrate`, the fixture and
      # oracle builders and the throttle interop only read settings, and none
      # of them connects to either.
      DJANGO_SETTINGS_MODULE: plane.settings.production
      DEBUG: "0"
      IS_TEST: "0"
      SECRET_KEY: ci-server-schema
      DATABASE_URL: postgresql://plane:plane@127.0.0.1:5432/plane_ci
      ENABLE_READ_REPLICA: "0"
      REDIS_URL: redis://127.0.0.1:6379/0
      RABBITMQ_HOST: 127.0.0.1
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: plane
      RABBITMQ_PASSWORD: plane
      RABBITMQ_VHOST: plane
      WEB_URL: http://127.0.0.1:18080
      ALLOWED_HOSTS: "*"
      ENABLE_DRF_SPECTACULAR: "0"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      # Read by plane-db's schema tests and by every crate's `schema_check`.
      # XCTEST/REQUIRE makes them fail instead of skipping when no database is
      # reachable.
      PLANE_RS_TEST_DATABASE_URL: postgresql://plane:plane@127.0.0.1:5432/plane_ci
      PLANE_RS_REQUIRE_DB_TESTS: "1"
      # plane-throttle's interop test FLUSHDBs its database, so it only runs
      # against 9-11 (crates/plane-throttle/tests/interop.rs). This is the
      # dedicated Valkey service above, not a shared cache.
      PLANE_RS_TEST_REDIS_URL: redis://localhost:6379/9
    steps:
      - uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          # uv version comes from [tool.uv] required-version.
          version-file: "apps/api/pyproject.toml"
          # Same patch release as the production image (python:3.12.12-alpine).
          python-version: "3.12.12"
          enable-cache: true
          cache-dependency-glob: "apps/api/uv.lock"

      - name: Install API dependencies
        working-directory: apps/api
        run: uv sync --locked

      # Django owns migrations until cutover; the Rust crates adapt to the
      # schema this produces.
      - name: Migrate the CI database
        working-directory: apps/api
        run: uv run --no-sync python manage.py migrate --noinput

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build output
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/server -> target
          key: schema

      # Every crate that talks to the database carries its own
      # `tests/schema_check.rs`; a glob finds them so a new crate is checked
      # without editing this workflow. With PLANE_RS_REQUIRE_DB_TESTS=1 a
      # missing database is a failure, not a skip.
      - name: Schema checks (every crate)
        working-directory: apps/server
        run: |
          set -euo pipefail
          shopt -s nullglob
          targets=(crates/*/tests/schema_check.rs)
          if [ "${#targets[@]}" -eq 0 ]; then
            echo "::notice::no crates/*/tests/schema_check.rs yet; skipping schema checks."
            exit 0
          fi
          for target in "${targets[@]}"; do
            crate_dir="$(dirname "$(dirname "$target")")"
            if [ ! -f "$crate_dir/Cargo.toml" ]; then
              echo "::notice::$crate_dir has no manifest yet; skipping its schema check."
              continue
            fi
            echo "::group::schema_check $crate_dir"
            cargo test --manifest-path "$crate_dir/Cargo.toml" --test schema_check
            echo "::endgroup::"
          done

      # The fixture builder refuses a database that is not a `t_*` clone, and
      # the oracle only reads. Clone the migrated database so the fixture's
      # writes and the 76k oracle reads stay off plane_ci, which the schema
      # checks above just used.
      - name: Clone the migrated database for the permissions fixture
        if: >-
          hashFiles('apps/server/crates/plane-permissions/Cargo.toml') != '' &&
          hashFiles('apps/server/tools/permissions/fixture.py') != '' &&
          hashFiles('apps/server/tools/permissions/oracle.py') != ''
        run: |
          # `mkdb.sh` clones the local dev template; in CI the migrated
          # database is the template. `CREATE DATABASE ... TEMPLATE` needs no
          # session attached to the template, so terminate leftovers and retry
          # (the postgres service healthcheck connects to plane_ci too).
          for attempt in 1 2 3 4 5; do
            docker exec -i "${{ job.services.postgres.id }}" \
              psql --no-psqlrc -X -q -U plane -d postgres -v ON_ERROR_STOP=1 \
              -c "SELECT pg_terminate_backend(pid) FROM pg_stat_activity WHERE datname = 'plane_ci' AND pid <> pg_backend_pid()" \
              >/dev/null
            if docker exec -i "${{ job.services.postgres.id }}" \
              psql --no-psqlrc -X -q -U plane -d postgres -v ON_ERROR_STOP=1 \
              -c 'CREATE DATABASE "t_perms_fixture" TEMPLATE "plane_ci"'; then
              exit 0
            fi
            echo "clone attempt $attempt failed; retrying"
            sleep 2
          done
          echo "::error::could not clone plane_ci to t_perms_fixture."
          exit 1

      # mkdb.sh clones plane_tpl, which bootstrap.sh seeds with exactly one
      # instance row. CI clones the migrated database instead, so create that
      # row here; fixture.py refuses zero or two. Directly, not through
      # `register_instance`: that command queries the GitHub API and publishes
      # a Celery task, and this job has no broker.
      - name: Seed the fixture clone with the instance row
        if: >-
          hashFiles('apps/server/crates/plane-permissions/Cargo.toml') != '' &&
          hashFiles('apps/server/tools/permissions/fixture.py') != '' &&
          hashFiles('apps/server/tools/permissions/oracle.py') != ''
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://plane:plane@127.0.0.1:5432/t_perms_fixture
        run: |
          uv run --no-sync python manage.py shell <<'PY'
          from django.utils import timezone

          from plane.license.models import Instance

          Instance.objects.create(
              instance_name="Plane CI",
              instance_id="ci-perms-fixture",
              current_version="v0.1.0",
              last_checked_at=timezone.now(),
          )
          PY

      # tools/permissions/README.md ("Rebuild from scratch"), with the CI
      # database URL in place of run.sh's dev stack. `run.sh` sources
      # dev/django-env.sh, which points at 127.0.0.1:55432; CI has no dev
      # stack, so the job-level environment and the override above are used.
      - name: Build the permissions fixture
        if: >-
          hashFiles('apps/server/crates/plane-permissions/Cargo.toml') != '' &&
          hashFiles('apps/server/tools/permissions/fixture.py') != '' &&
          hashFiles('apps/server/tools/permissions/oracle.py') != ''
        working-directory: apps/api
        env:
          # These scripts live outside the Django project, so `plane` has to be
          # importable by path (what run.sh sets on PYTHONPATH).
          PYTHONPATH: ${{ github.workspace }}/apps/api
          DATABASE_URL: postgresql://plane:plane@127.0.0.1:5432/t_perms_fixture
        run: uv run --no-sync python ../server/tools/permissions/fixture.py

      - name: Run the permission oracle
        if: >-
          hashFiles('apps/server/crates/plane-permissions/Cargo.toml') != '' &&
          hashFiles('apps/server/tools/permissions/fixture.py') != '' &&
          hashFiles('apps/server/tools/permissions/oracle.py') != ''
        working-directory: apps/api
        env:
          PYTHONPATH: ${{ github.workspace }}/apps/api
          DATABASE_URL: postgresql://plane:plane@127.0.0.1:5432/t_perms_fixture
        run: uv run --no-sync python ../server/tools/permissions/oracle.py

      # The database name is fixed to t_perms_fixture so the `database` field
      # in both golden files is the one committed; no field is filtered out.
      - name: Fail on a stale permission golden
        if: >-
          hashFiles('apps/server/crates/plane-permissions/Cargo.toml') != '' &&
          hashFiles('apps/server/tools/permissions/fixture.py') != '' &&
          hashFiles('apps/server/tools/permissions/oracle.py') != ''
        run: |
          set -e
          if ! git diff --exit-code -- apps/server/crates/plane-permissions/tests/golden/; then
            echo "::error::the permission golden matrix is stale. Rebuild it as tools/permissions/README.md documents and commit the result."
            exit 1
          fi

      # Both tests: `golden` replays the matrix against the fixture database,
      # `schema_check` re-verifies that database's schema.
      - name: Permission tests against the fixture database
        if: hashFiles('apps/server/crates/plane-permissions/Cargo.toml') != ''
        working-directory: apps/server
        env:
          PLANE_RS_TEST_DATABASE_URL: postgresql://plane:plane@127.0.0.1:5432/t_perms_fixture
        run: cargo test -p plane-permissions

      # Runs the real DRF throttle classes through Django against the Valkey
      # service, then the same steps through plane-throttle, and compares the
      # decision, key, raw pickle bytes and TTLs. Needs apps/api/.venv (the
      # test spawns apps/api/.venv/bin/python) and DB 9, which it FLUSHDBs.
      - name: Throttle interop against Valkey
        if: >-
          hashFiles('apps/server/crates/plane-throttle/Cargo.toml') != '' &&
          hashFiles('apps/server/crates/plane-throttle/tests/interop.rs') != ''
        working-directory: apps/server
        env:
          PLANE_RS_TEST_REDIS_URL: redis://localhost:6379/9
        run: cargo test -p plane-throttle

      # Live storage tests. Not a `services:` entry: the silo image's CMD is
      # the bare `silo` binary, which prints usage, so a running server needs
      # both an entrypoint and arguments (the bucket must exist). `options:`
      # can pass --entrypoint but not the arguments, so the container is
      # started directly, with the same entrypoint docker-compose-test.yml
      # uses. Objects live under t_storage/<uuid>/ and are deleted by the test.
      - name: Start MinIO (silo) for the live storage tests
        if: hashFiles('apps/server/crates/plane-storage/Cargo.toml') != ''
        run: |
          set -euo pipefail
          docker run --rm -d --name plane-rs-ci-minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=access-key \
            -e MINIO_ROOT_PASSWORD=secret-key \
            docker.io/pgsty/silo:RELEASE.2026-09-16T00-00-00Z \
            /bin/sh -c '
              set -eu
              mkdir -p /export/uploads
              silo server /export --address ":9000" --console-address ":9001" &
              silo_pid=$!
              until mc alias set local http://127.0.0.1:9000 access-key secret-key >/dev/null 2>&1; do sleep 1; done
              until mc ready local >/dev/null 2>&1; do sleep 1; done
              mc mb --ignore-existing local/uploads >/dev/null
              wait $silo_pid
            '
          # The bucket exists once `mc ls` succeeds inside the container; the
          # image puts `mc` on PATH and points MC_CONFIG_DIR at /tmp/.mc, where
          # the script above wrote the alias.
          for _ in $(seq 1 60); do
            if docker exec plane-rs-ci-minio mc ls local/uploads >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          docker logs plane-rs-ci-minio || true
          echo "::error::MinIO did not become ready with the uploads bucket."
          exit 1

      # PLANE_RS_REQUIRE_DB_TESTS=1 (job env) makes the live suite fail rather
      # than skip if the URL is missing; the tests share the bucket, hence one
      # thread.
      - name: Live MinIO storage tests
        if: hashFiles('apps/server/crates/plane-storage/Cargo.toml') != ''
        working-directory: apps/server
        env:
          PLANE_RS_TEST_S3_URL: http://127.0.0.1:9000
        run: cargo test -p plane-storage -- --test-threads=1

      - name: Stop MinIO
        if: always()
        run: docker rm -f plane-rs-ci-minio >/dev/null 2>&1 || true

  inventory:
    name: Route inventory and proxy config
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    env:
      # Same environment as the regeneration command in ROUTES.md. The script
      # sets these itself if they are absent; being explicit keeps CI immune to
      # a change in those defaults. No database or Redis connection is opened.
      DJANGO_SETTINGS_MODULE: plane.settings.production
      SECRET_KEY: inventory
      DATABASE_URL: postgresql://x:x@127.0.0.1:1/x
      REDIS_URL: redis://127.0.0.1:1/0
      ENABLE_DRF_SPECTACULAR: "0"
    steps:
      - uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version-file: "apps/api/pyproject.toml"
          python-version: "3.12.12"
          enable-cache: true
          cache-dependency-glob: "apps/api/uv.lock"

      - name: Install API dependencies
        working-directory: apps/api
        run: uv sync --locked

      # Both corpora are generated by CPython itself (`tools/net/*_corpus.py`)
      # and are replayed by cargo tests. --check regenerates into memory, so a
      # hand edit, a stale table or a Python behaviour change fails here
      # instead of silently weakening the Rust tests. tools/storage/golden.py
      # has no check mode (it writes tests/golden/presign.json and verifies
      # determinism internally), so it is not checked here.
      - name: Check the generated golden corpora are current
        working-directory: apps/api
        run: |
          uv run --no-sync python ../server/tools/net/ssrf_corpus.py --check
          uv run --no-sync python ../server/tools/net/ip_network_corpus.py --check

      # The committed commit field is the pin: passing it back means the run is
      # reproducible on a branch where HEAD has moved, so any diff below is a
      # real staleness, not a newer commit hash.
      - name: Regenerate routes.json and ROUTES.md
        working-directory: apps/api
        run: |
          PINNED="$(uv run --no-sync python -c 'import json; print(json.load(open("../server/routes.json"))["generated_from"]["commit"])')"
          echo "Pinned commit: $PINNED"
          uv run --no-sync python ../server/tools/inventory/routes.py --commit "$PINNED"

      - name: Fail on a stale inventory
        run: |
          set -e
          if ! git diff --exit-code -- apps/server/routes.json apps/server/ROUTES.md; then
            echo "::error::apps/server/routes.json or ROUTES.md is stale. Run routes.py with the pinned commit and commit the result."
            echo "The Owner and Status columns are preserved from the committed ROUTES.md; editing them here is not a fix."
            exit 1
          fi

      # apps/server/models.json and crates/plane-db/src/models/** are generated
      # from Django's own model metadata. A hand edit, a model change without a
      # regeneration, or a removed generated file fails here.
      - name: Check the generated model snapshot is current
        working-directory: apps/api
        run: uv run --no-sync python ../server/tools/codegen/models.py --check

      # apps/server/serializers.json, SERIALIZERS.md and
      # crates/plane-serializers/src/generated/** come from DRF's own
      # introspection of every Plane serializer (field order, sources,
      # fields=/expand=). A hand edit, a serializer change without a
      # regeneration, or a removed generated module fails here.
      - name: Check the generated serializer inventory is current
        working-directory: apps/api
        run: uv run --no-sync python ../server/tools/inventory/serializers.py --check

      - name: Check the generated proxy snippet is current
        working-directory: apps/api
        run: uv run --no-sync python ../server/tools/proxy/gen_caddy.py --check

      - name: Proxy generator tests
        working-directory: apps/api
        run: uv run --no-sync python -m pytest ../server/tools/proxy/test_gen_caddy.py -q

  license:
    name: Licence headers
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.22"

      - name: Install addlicense
        run: |
          go install github.com/google/addlicense@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Check apps/server sources
        run: |
          set -euo pipefail
          mapfile -t FILES < <(git ls-files 'apps/server/**/*.rs' 'apps/server/**/*.py' 'apps/server/**/*.sh')
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "No apps/server .rs, .py or .sh files to check."
            exit 0
          fi
          echo "Checking ${#FILES[@]} file(s)."
          addlicense -check -f COPYRIGHT.txt "${FILES[@]}"
