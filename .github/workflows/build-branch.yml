#
# Publishes the nine plane-rs images to GHCR, multi-arch (linux/amd64 and
# linux/arm64; the target deployment is an arm64 Raspberry Pi cluster).
#
# Each (image, arch) pair is built natively on a runner of that architecture and
# pushed by digest; a per-image merge job stitches the two digests into one
# manifest and applies the tags. Any job that consumes an image BY TAG must
# depend on its merge job, never on the build job.
#
# Authentication is the built-in GITHUB_TOKEN with `packages: write`. There are
# no Docker Hub secrets: everything lives under ghcr.io/nizarcan.
name: Branch Build

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag (default: dispatch-<short sha>)"
        required: false
        type: string
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/nizarcan

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-24.04
    outputs:
      tags: ${{ steps.tags.outputs.tags }}
      image_matrix: ${{ steps.tags.outputs.image_matrix }}
      is_release: ${{ steps.tags.outputs.is_release }}
      release_tag: ${{ steps.tags.outputs.release_tag }}
    steps:
      - id: tags
        name: Compute tags
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          out() { echo "$1=$2" >> "$GITHUB_OUTPUT"; }
          IMAGES='["api","worker","beat","migrator","web","space","admin","live","proxy"]'
          out image_matrix "${IMAGES}"

          is_release=false
          release_tag=""
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
            release_tag="${tag}"
            is_release=true
            tags="${tag}"
            # `latest` only for a final release: v1.5.0, not v1.5.0-rc2.
            if [[ "${tag}" != *-* ]]; then
              tags="${tags} latest"
            fi
          elif [[ "${GITHUB_REF}" == refs/heads/main ]]; then
            tags="main sha-${GITHUB_SHA:0:7}"
          else
            tags="${INPUT_TAG:-dispatch-${GITHUB_SHA:0:7}}"
          fi
          out tags "${tags}"
          out is_release "${is_release}"
          out release_tag "${release_tag}"
          echo "publishing tags: ${tags}"

  build:
    name: Build ${{ matrix.image }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    needs: [prepare]
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.prepare.outputs.image_matrix) }}
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
            platform: linux/amd64
          - arch: arm64
            # Native arm64 runner (public repositories get it for free). The
            # arm64 image is never built under QEMU, which would turn a ~40
            # minute Rust link into hours.
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    steps:
      - uses: actions/checkout@v6

      - id: inputs
        name: Resolve build inputs
        run: |
          set -euo pipefail
          case "${{ matrix.image }}" in
            api)
              echo "context=." >> "$GITHUB_OUTPUT"
              echo "dockerfile=apps/server/deploy/docker/Dockerfile.plane-api" >> "$GITHUB_OUTPUT"
              ;;
            worker)
              echo "context=." >> "$GITHUB_OUTPUT"
              echo "dockerfile=apps/server/deploy/docker/Dockerfile.plane-jobs" >> "$GITHUB_OUTPUT"
              echo "build_args=JOBS_BINARY=plane-worker" >> "$GITHUB_OUTPUT"
              ;;
            beat)
              echo "context=." >> "$GITHUB_OUTPUT"
              echo "dockerfile=apps/server/deploy/docker/Dockerfile.plane-jobs" >> "$GITHUB_OUTPUT"
              echo "build_args=JOBS_BINARY=plane-beat" >> "$GITHUB_OUTPUT"
              ;;
            migrator)
              echo "context=." >> "$GITHUB_OUTPUT"
              echo "dockerfile=apps/server/deploy/docker/Dockerfile.plane-jobs" >> "$GITHUB_OUTPUT"
              echo "build_args=JOBS_BINARY=plane-migrator" >> "$GITHUB_OUTPUT"
              ;;
            web)
              echo "context=." >> "$GITHUB_OUTPUT"
              echo "dockerfile=apps/web/Dockerfile.web" >> "$GITHUB_OUTPUT"
              ;;
            space)
              echo "context=." >> "$GITHUB_OUTPUT"
              echo "dockerfile=apps/space/Dockerfile.space" >> "$GITHUB_OUTPUT"
              ;;
            admin)
              echo "context=." >> "$GITHUB_OUTPUT"
              echo "dockerfile=apps/admin/Dockerfile.admin" >> "$GITHUB_OUTPUT"
              ;;
            live)
              echo "context=." >> "$GITHUB_OUTPUT"
              echo "dockerfile=apps/live/Dockerfile.live" >> "$GITHUB_OUTPUT"
              ;;
            proxy)
              echo "context=apps/proxy" >> "$GITHUB_OUTPUT"
              echo "dockerfile=apps/proxy/Dockerfile.ce" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "unknown image ${{ matrix.image }}" >&2
              exit 1
              ;;
          esac

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@v7.0.0
        with:
          context: ${{ steps.inputs.outputs.context }}
          file: ${{ steps.inputs.outputs.dockerfile }}
          platforms: ${{ matrix.platform }}
          build-args: ${{ steps.inputs.outputs.build_args }}
          push: true
          # One platform per job: push an untagged-by-name digest and merge the
          # two manifests later. Provenance/SBOM would attach an attestation to
          # each digest and make the final index ambiguous.
          provenance: false
          sbom: false
          outputs: type=image,name=${{ env.IMAGE_PREFIX }}/plane-rs-${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          # Per-arch scope: the two legs build the same layers and would
          # otherwise overwrite each other's cache entry.
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.arch }}

      - name: Export digest
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.image }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Publish ${{ matrix.image }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [prepare, build]
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.prepare.outputs.image_matrix) }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digests-${{ matrix.image }}-*
          path: /tmp/digests
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest
        run: |
          set -euo pipefail
          image="${IMAGE_PREFIX}/plane-rs-${{ matrix.image }}"
          tag_args=()
          for tag in ${{ needs.prepare.outputs.tags }}; do
            tag_args+=("-t" "${image}:${tag}")
          done
          digests=()
          for digest in /tmp/digests/*; do
            digests+=("${image}@sha256:$(basename "${digest}")")
          done
          docker buildx imagetools create "${tag_args[@]}" "${digests[@]}"

  # The CLI installer (deployments/cli/community/install.sh) downloads
  # docker-compose.yml, variables.env, setup.sh and the restore scripts from the
  # release assets, so a v* tag must still publish them.
  release:
    name: Publish release assets
    runs-on: ubuntu-24.04
    needs: [prepare, merge]
    if: ${{ needs.prepare.outputs.is_release == 'true' }}
    permissions:
      contents: write
    env:
      REL_VERSION: ${{ needs.prepare.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Assemble CLI assets
        run: |
          set -euo pipefail
          cp ./deployments/cli/community/install.sh ./deployments/cli/community/setup.sh
          sed -i "s/\${APP_RELEASE:-stable}/\${APP_RELEASE:-${REL_VERSION}}/g" \
            ./deployments/cli/community/docker-compose.yml

      - name: Create release
        uses: softprops/action-gh-release@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.REL_VERSION }}
          name: ${{ env.REL_VERSION }}
          target_commitish: ${{ github.sha }}
          draft: false
          # A prerelease tag (v1.5.0-rc2) creates a prerelease; the release
          # workflow never overwrites the `latest` image tag for one.
          prerelease: ${{ contains(env.REL_VERSION, '-') }}
          generate_release_notes: true
          files: |
            ${{ github.workspace }}/deployments/cli/community/setup.sh
            ${{ github.workspace }}/deployments/cli/community/restore.sh
            ${{ github.workspace }}/deployments/cli/community/restore-airgapped.sh
            ${{ github.workspace }}/deployments/cli/community/docker-compose.yml
            ${{ github.workspace }}/deployments/cli/community/variables.env
            ${{ github.workspace }}/deployments/swarm/community/swarm.sh
