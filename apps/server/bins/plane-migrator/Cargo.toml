[package]
name = "plane-migrator"
description = "Creates the Rust-owned Postgres schema (plane_jobs)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "plane-migrator"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
plane-core = { path = "../../crates/plane-core" }
plane-db = { path = "../../crates/plane-db" }
plane-jobs = { path = "../../crates/plane-jobs" }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
