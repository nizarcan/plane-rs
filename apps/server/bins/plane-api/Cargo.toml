[package]
name = "plane-api"
description = "Plane's HTTP API server, byte-compatible with the Django application it replaces"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "plane-api"
path = "src/main.rs"

[features]
default = []
# Test-only `/_plane_rs/test/` endpoints. Off by default; the release binary
# must not contain them (Phase 2 exit check).
test-endpoints = []

[dependencies]
anyhow.workspace = true
axum.workspace = true
chrono.workspace = true
deadpool-postgres.workspace = true
flate2.workspace = true
futures-util.workspace = true
http.workspace = true
mimalloc.workspace = true
percent-encoding.workspace = true
plane-auth = { path = "../../crates/plane-auth" }
plane-core = { path = "../../crates/plane-core" }
plane-db = { path = "../../crates/plane-db" }
plane-serde = { path = "../../crates/plane-serde" }
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = [
  "macros",
  "net",
  "rt-multi-thread",
  "signal",
  "time",
] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = [
  "env-filter",
  "fmt",
  "json",
] }
tokio-postgres.workspace = true
uuid.workspace = true

[lints]
workspace = true
