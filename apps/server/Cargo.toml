# Workspace for the Rust rewrite of Plane's backend.
#
# Members are globs so a new crate or binary can be added without editing this file.

[workspace]
resolver = "3"
# Globs so a new crate or binary can be added without editing this file.
members = ["crates/*", "bins/*"]
# `plane-testkit` is a separate workspace on purpose. Cargo unifies features
# across every package in a workspace, and the harness needs `serde_json`
# with `preserve_order` + `arbitrary_precision`, `tokio` "full", `reqwest`,
# `lapin`, ... Running `cargo test --workspace` must not compile the server
# with those features: `arbitrary_precision` changes how `serde_json` stores
# and prints numbers, so the server would run different code in tests than in
# the production binary. Build it with
# `cargo ... --manifest-path crates/plane-testkit/Cargo.toml`.
exclude = ["crates/plane-testkit", "vendor/zxcvbn"]

# `vendor/zxcvbn` is upstream `zxcvbn` 3.1.1 with two changes: the
# 100-character input cap is raised to 128, the window `is_password_strong`
# scores, and one-character l33t matches are dropped as Python drops them. See
# `vendor/zxcvbn/VENDORED.md`.
[patch.crates-io]
zxcvbn = { path = "vendor/zxcvbn" }

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "AGPL-3.0-only"
repository = "https://github.com/makeplane/plane"

# Shared versions for the server crates. Versions only, with features kept to
# what every user needs: each crate enables the features it actually uses
# (`serde` needs `derive` almost everywhere, so it is included here). Never add
# a feature here for one crate's convenience; that would enable it for all of
# them. The differential harness is excluded from this workspace and declares
# its own dependencies (see `exclude` above).
[workspace.dependencies]
ammonia = "=4.0.0"
anyhow = "1.0.100"
aws-lc-rs = "1.19.0"
axum = "0.8.9"
base64 = "0.22.1"
chrono = { version = "0.4.42", default-features = false, features = [
  "std",
  "clock",
] }
chrono-tz = "0.10"
deadpool-postgres = "0.14.2"
# `getaddrinfo`/`getnameinfo` wrappers for `socket.getfqdn()` (SMTP EHLO and
# Message-ID, DECISIONS.md D23). Safe API over the same libc calls CPython
# makes; `libc` is already in the dependency graph through `gethostname`.
dns-lookup = "4.0.2"
flate2 = "1.1.11"
futures-util = "0.3.31"
# `socket.gethostname()` (SMTP `getfqdn()`); already used by `plane-jobs`.
gethostname = "1.1.0"
getrandom = "0.3.4"
http = "1.5.0"
ipnet = "2.12.2"
# SMTP for the instance e-mail test (PUBLIC_INSTANCES.md §2c). Defaults are off:
# native-tls and ring would add a second TLS stack and a second rustls crypto
# provider (DECISIONS.md D9). `aws-lc-rs` + `webpki-roots` reuse the workspace
# pins, and `tokio1` fits the server runtime.
lettre = { version = "0.11.24", default-features = false, features = [
  "smtp-transport",
  "tokio1-rustls",
  "aws-lc-rs",
  "webpki-roots",
] }
md-5 = "0.10.6"
mimalloc = "0.1.52"
percent-encoding = "2.3.2"
regex = "1.12.2"
rustls = "0.23.46"
rustls-pemfile = "2.2.0"
scrypt = "0.11.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.10.7"
thiserror = "2.0.21"
tokio = "1.54.1"
tokio-postgres = "0.7.18"
tokio-postgres-rustls = "0.14.0"
tracing = "0.1.44"
tracing-subscriber = "0.3.20"
uuid = "1.29.2"
url = "2.5.8"
webpki-roots = "1.0.12"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

# Debug builds: line tables only (backtraces keep file:line) and no debug info for
# dependencies. Full debug info made each target/ directory 5-20 GB and filled the disk
# while several agents built in parallel worktrees.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# zxcvbn's dictionary match is super-linear on random input (a 128-character
# random-printable password is ~0.6 s optimized, many seconds unoptimized), so
# the recorded corpus in `crates/plane-auth/tests/zxcvbn_corpus.rs` is
# unusable without optimizing this one dependency. Test binaries of the
# workspace crates stay unoptimized.
[profile.test.package.zxcvbn]
opt-level = 3
