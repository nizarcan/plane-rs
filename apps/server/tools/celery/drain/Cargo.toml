#
# A tiny standalone tool that drains a Celery queue with the differential
# harness's own decoder (`plane-testkit::celery::CeleryDrain`). It lives
# outside the server workspace on purpose: plane-testkit is its own workspace
# and must not leak its features into the production crates.
#
#   cargo run --manifest-path apps/server/tools/celery/drain/Cargo.toml -- \
#       amqp://plane:plane@127.0.0.1:55672/t_celery_live

[workspace]

[package]
name = "celery-drain"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "AGPL-3.0-only"
publish = false

[dependencies]
plane-testkit = { path = "../../../crates/plane-testkit" }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
