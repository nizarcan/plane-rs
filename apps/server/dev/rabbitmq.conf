#
# Mounted at /etc/rabbitmq/rabbitmq.conf by dev/compose.yml.
#
# The Erlang VM would otherwise size its memory alarm from the Docker VM's
# memory (~2 GB), letting the broker grow past its 320 MB container limit and
# be OOM-killed. Above 192 MiB RabbitMQ applies publisher flow control instead:
# the dev broker stays up, unacked Celery messages simply wait.

vm_memory_high_watermark.absolute = 192MiB
