[package]
name = "plane-db"
description = "Postgres pools, dj-database-url parsing and the static query catalog for the Plane Rust services"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
chrono = { workspace = true, features = ["serde"] }
chrono-tz.workspace = true
deadpool-postgres.workspace = true
http.workspace = true
plane-core = { path = "../plane-core" }
plane-serde = { path = "../plane-serde" }
rustls = { workspace = true, default-features = false, features = [
  "aws_lc_rs",
  "std",
  "tls12",
] }
rustls-pemfile.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt"] }
tokio-postgres = { workspace = true, features = [
  "with-chrono-0_4",
  "with-serde_json-1",
  "with-uuid-1",
] }
tokio-postgres-rustls = { workspace = true, features = ["aws-lc-rs"] }
tracing.workspace = true
unicode-normalization = "0.1.26"
uuid = { workspace = true, features = ["serde"] }
webpki-roots.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
