[package]
name = "plane-auth"
description = "Sessions, password hashing, CSRF, origin checks and API keys, byte-compatible with the Django application Plane runs today"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
aws-lc-rs.workspace = true
base64.workspace = true
chrono.workspace = true
deadpool-postgres.workspace = true
flate2.workspace = true
getrandom.workspace = true
http.workspace = true
md-5.workspace = true
percent-encoding.workspace = true
plane-cache = { path = "../plane-cache" }
plane-core = { path = "../plane-core" }
plane-db = { path = "../plane-db" }
plane-jobs = { path = "../plane-jobs" }
# `pyurl`: CPython's `urlsplit`/`urlparse`/`urljoin`, already golden-tested by
# that crate. The auth redirects cannot use `url`'s RFC parser: Django's
# safety check depends on CPython's quirks (bracketed hosts, NFKC netlocs).
plane-net = { path = "../plane-net" }
plane-serde = { path = "../plane-serde" }
regex.workspace = true
scrypt.workspace = true
serde.workspace = true
serde_json.workspace = true
sha1.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "sync"] }
tokio-postgres.workspace = true
tracing.workspace = true
uuid.workspace = true
# `is_password_strong`: see `auth_flow/password.rs`. Wired to the vendored
# `apps/server/vendor/zxcvbn` by `[patch.crates-io]` in the workspace root; the
# vendor patch raises the crate's 100-character cap to Plane's 128-character
# window and matches Python's l33t filtering. The corpus test pins score
# equality on every recorded window.
zxcvbn = { version = "3.1.1", default-features = false }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[[example]]
name = "hash_roundtrip"
path = "examples/hash_roundtrip.rs"

[lints]
workspace = true
