[package]
name = "plane-auth"
description = "Sessions, password hashing, CSRF, origin checks and API keys, byte-compatible with the Django application Plane runs today"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
aws-lc-rs.workspace = true
base64.workspace = true
chrono.workspace = true
deadpool-postgres.workspace = true
flate2.workspace = true
getrandom.workspace = true
http.workspace = true
md-5.workspace = true
percent-encoding.workspace = true
plane-core = { path = "../plane-core" }
plane-db = { path = "../plane-db" }
scrypt.workspace = true
serde.workspace = true
serde_json.workspace = true
sha1.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "sync"] }
tokio-postgres.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[[example]]
name = "hash_roundtrip"
path = "examples/hash_roundtrip.rs"

[lints]
workspace = true
