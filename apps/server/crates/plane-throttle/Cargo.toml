[package]
name = "plane-throttle"
description = "DRF rate throttles over django-redis-compatible Redis keys, wire-compatible with Django"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# The cache client (and its Redis connection) lives in `plane-cache`: one
# django-redis implementation for throttles, response caching and page caching.
plane-cache = { path = "../plane-cache" }

http.workspace = true
# `plane_auth::RequestUser` is the production `request.user`; the throttle
# reads it through the `ThrottleUser` trait (see `throttle.rs`).
plane-auth = { path = "../plane-auth" }
plane-core = { path = "../plane-core" }
plane-serde = { path = "../plane-serde" }
thiserror.workspace = true
tokio = { workspace = true, features = ["sync"] }
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
