[package]
name = "plane-tasks"
description = "Rust task handlers for the Celery tasks Plane's Django backend owns"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Test-only. `difftest task` runs its fake HTTP server on 127.0.0.1 and needs
# the crawl handler to reach it; the harness builds `plane-worker` with this
# feature. A release build has the feature off, so the environment variable the
# harness sets cannot widen the SSRF guard in production.
default = []
difftest = []

[dependencies]
base64.workspace = true
chrono.workspace = true
deadpool-postgres.workspace = true
flate2.workspace = true
hmac = "0.12.1"
plane-auth = { path = "../plane-auth" }
plane-cache = { path = "../plane-cache" }
plane-core = { path = "../plane-core" }
plane-db = { path = "../plane-db" }
plane-jobs = { path = "../plane-jobs" }
plane-mail = { path = "../plane-mail" }
plane-net = { path = "../plane-net" }
plane-serde = { path = "../plane-serde" }
plane-storage = { path = "../plane-storage" }
plane-xlsx = { path = "../plane-xlsx" }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10.9"
thiserror.workspace = true
tokio = { workspace = true, features = ["time"] }
tokio-postgres.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
# The Django oracle (apps/api at the UPSTREAM.toml pin) for the hard-delete
# order test, which reads the Python task.
plane-oracle = { path = "../plane-oracle" }
serde_json.workspace = true

[lints]
workspace = true
