# `plane-testkit` is its own workspace root so that the features it needs
# (`serde_json` `preserve_order` + `arbitrary_precision`, `tokio` "full",
# `reqwest`, `lapin`, YAML, ...) are not unified into the server workspace and
# do not change how the server crates compile in `cargo test --workspace`.
# Build it with `--manifest-path crates/plane-testkit/Cargo.toml`.
[workspace]

[package]
name = "plane-testkit"
description = "Differential test harness comparing Django with the Rust backend"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "AGPL-3.0-only"
repository = "https://github.com/makeplane/plane"

[lib]
name = "plane_testkit"
path = "src/lib.rs"

[[bin]]
name = "difftest"
path = "src/bin/difftest.rs"

# Versions and features are pinned here rather than inherited from the server
# workspace, which must stay free of the harness's features.
[dependencies]
anyhow = "1.0.100"
base64 = "0.22.1"
bytes = "1.11.1"
chrono = { version = "0.4.42", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive"] }
flate2 = "1.1.11"
futures-util = "0.3.31"
hdrhistogram = "7.6.0"
hmac = "0.12.1"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["client", "http1", "server"] }
hyper-util = { version = "0.1.21", features = ["http1", "server", "tokio"] }
lapin = "4.12.3"
pbkdf2 = "0.12.2"
percent-encoding = "2.3.2"
regex = "1.12.2"
reqwest = { version = "0.13.5", default-features = false, features = [
  "rustls",
  "http2",
  "json",
] }
serde-pickle = "1.2.0"
sha2 = "0.10.9"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = [
  "preserve_order",
  "arbitrary_precision",
] }
serde_yaml_ng = "0.10.0"
similar = "3.2.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tokio-postgres = "0.7.18"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
uuid = { version = "1.29.2", features = ["v4"] }
aws-lc-rs = "1.19.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"

# Password verification is part of the harness's semantic checks, and Plane
# uses Django's 1,000,000-iteration PBKDF2: at `opt-level = 0` a single hash
# takes about 7 seconds. Compile the three crypto crates optimised even in the
# dev profile; the harness itself stays debuggable.
[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.hmac]
opt-level = 3

[profile.dev.package.pbkdf2]
opt-level = 3

# Debug builds: line tables only (backtraces keep file:line) and no debug info for
# dependencies. Full debug info made each target/ directory 5-20 GB and filled the disk
# while several agents built in parallel worktrees.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
