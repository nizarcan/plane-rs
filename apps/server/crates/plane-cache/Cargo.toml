[package]
name = "plane-cache"
description = "django-redis-compatible cache client, CPython protocol-4 pickle codec and Plane's DRF response caching"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# DECISIONS.md D5: `redis` 1.8 with a multiplexed `ConnectionManager`.
# `tokio-rustls-comp` brings TLS for `rediss://`; `tls-rustls-insecure` is what
# redis-rs requires to honour `ssl_cert_reqs=none` (an existing deployment
# option, ENV.md §1.4). DECISIONS.md D9 (one crypto provider, aws-lc-rs) is
# satisfied by enabling `aws_lc_rs` on the `rustls` dependency the crate pulls
# in indirectly, because Cargo unifies features across one build.
redis = { version = "1.8", default-features = false, features = [
  "tokio-comp",
  "connection-manager",
  "tokio-rustls-comp",
  "tls-rustls-insecure",
] }
rustls = { workspace = true, default-features = false, features = [
  "aws_lc_rs",
  "std",
  "tls12",
] }

chrono.workspace = true
# `md5` for the page-cache key, matching Django's `_generate_cache_key`.
md-5.workspace = true
percent-encoding.workspace = true
# `PyStr` (WTF-8 strings, so a lone surrogate survives a round trip) and
# `PyDecimal` (Python `decimal.Decimal`) already exist for the JSON paths.
plane-serde = { path = "../plane-serde" }
plane-core = { path = "../plane-core" }
serde.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync"] }
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
