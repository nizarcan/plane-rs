#
# `/static/*` is the one path Django still served after the HTTP cutover
# (`Caddyfile.ce:18`). `plane-api` answers it from the eight embedded files
# (`plane-bootstrap/src/static_files.rs`); Django answers it from WhiteNoise.
#
# This scenario needs a Django target with a collected static root, which the
# dev stack does not have: run it with a targets file whose `django` command is
# `tools/boot/django-static-serve.sh {port}` (see tools/boot/README.md).
# `redis_db` keeps it inside the boot set's own databases; no step touches the
# database or Redis.
name: boot-static
template_db: plane_tpl
redis_db: [7, 8]
vars:
steps:
  - name: static-github-logo
    method: GET
    path: "/static/logos/github_32px.png"
    jar: anon1
    headers:
      Host: plane-fixture.test
  - name: static-twitter-logo
    method: GET
    path: "/static/logos/twitter_32px.png"
    jar: anon1
    headers:
      Host: plane-fixture.test
  - name: static-linkedin-logo
    method: GET
    path: "/static/logos/linkedin_32px.png"
    jar: anon1
    headers:
      Host: plane-fixture.test
  - name: static-website-logo
    method: GET
    path: "/static/logos/website_32px.png"
    jar: anon1
    headers:
      Host: plane-fixture.test
  - name: static-plane-logo
    method: GET
    path: "/static/logos/Logo.png"
    jar: anon1
    headers:
      Host: plane-fixture.test
  - name: static-style-css
    method: GET
    path: "/static/css/style.css"
    jar: anon1
    headers:
      Host: plane-fixture.test
  - name: static-script-js
    method: GET
    path: "/static/js/script.js"
    jar: anon1
    headers:
      Host: plane-fixture.test
  - name: static-humans-txt
    method: GET
    path: "/static/humans.txt"
    jar: anon1
    headers:
      Host: plane-fixture.test
  - name: static-head-logo
    method: HEAD
    path: "/static/logos/github_32px.png"
    jar: anon1
    headers:
      Host: plane-fixture.test
