  - name: write-states-01-create-minimal
    method: POST
    path: "/api/workspaces/{{ws}}/projects/{{project_alpha}}/states/"
    json:
      name: "QA Minimal"
      color: "#123456"
    jar: admin
    headers:
      Host: plane-fixture.test
      Cookie: "session-id={{session_admin}}"
    expect_status: 200
    capture:
      - name: state_minimal
        source: db
        table: states
        column: id

  - name: write-states-02-create-full
