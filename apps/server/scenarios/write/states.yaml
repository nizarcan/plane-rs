      id: "77777777-7777-4777-8777-777777777777"
      project_id: "{{project_beta}}"
      workspace_id: "88888888-8888-4888-8888-888888888888"
      name: "QA Full"
      color: "#abcdef"
      group: "started"
      default: true
      is_triage: true
      slug: "client-slug"
      description: "full body"
      sequence: 1.0
      external_source: "ignored"
      external_id: "ignored"
    jar: admin
    headers:
      Host: plane-fixture.test
      Cookie: "session-id={{session_admin}}"
    expect_status: 200
    capture:
      - name: state_full
        source: db
        table: states
        column: id

