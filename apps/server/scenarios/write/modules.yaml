  module_alpha_in_progress: "5e5035ff-8628-4833-87af-d4226f124c4f"
  module_alpha_completed: "e03eff9f-ec87-4133-bee9-474d29c4d397"
  module_alpha_cancelled: "a9cd2566-6ca2-40a5-ad76-81abe779cb42"
  module_alpha_planned: "cac530e3-b832-4ca9-aef9-f4427b1a8f86"
  module_alpha_archived: "710da01c-8e38-407d-bfce-f7674b644275"
  admin_id: "d44ae570-3de4-4413-af08-f686bf5b7235"
  member_id: "78100240-9cfd-4782-8627-25ab039c6e9a"
