#
# Modules set A (module core) write scenario:
#
#   POST    /api/workspaces/{slug}/projects/{project_id}/modules/              (103)
#   PATCH   /api/workspaces/{slug}/projects/{project_id}/modules/{pk}/         (104)
#   DELETE  /api/workspaces/{slug}/projects/{project_id}/modules/{pk}/         (104)
#   PUT     the same route answers 405                                        (104)
#   PATCH   .../modules/{module_id}/user-properties/                          (112)
#   POST    .../modules/{module_id}/archive/                                  (113)
#   DELETE  .../modules/{module_id}/archive/                                  (113)
#   POST    .../archived-modules/ and .../archived-modules/{pk}/ (both 500)   (114, 115)
#   DELETE  the same two routes (both 500)                                    (114, 115)
#
# Covers the H21 sort-order hook across several creates (the fixture's live
# minimum, archived modules included), the serializer's duplicate-name
# `{"error": …}` and `validate()` non-field 400s, the `lead`/`lead_id` alias
# merge, member bulk_create on create and the H04 replace on PATCH, every
# PATCH-able column, the archived guard, the view's own 404, the permission
# matrix and a foreign-origin 403, user properties (201 from the in-memory
# instance, null -> 400, missing row/module -> 404), archive/unarchive (the
# archive POST removes every user's favourite and answers Python `str()` of the
# datetime), the unconditional 114/115 500s, and DELETE with its ordered side
# effects (one activity per module issue, H03 + cascade, H04 module issues and
# the caller's favourite, hard-deleted recent visits). The favourite and recent
# visit rows the deletes act on are seeded by `modules-fixture.sql`, because the
# route that creates favourites (110) belongs to set B and still answers 501 on
# the Rust target of this scenario. One seeded visit is already soft-deleted:
# the hard delete runs through `UserRecentVisit.objects`, so it must survive.

name: write-modules
template_db: plane_fix_tpl
redis_db: [7, 8]
target_env:
  PYTHONHASHSEED: "0"
vars:
  fixture_sql: "{repo}/apps/server/scenarios/write/modules-fixture.sql"
