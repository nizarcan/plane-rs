    method: POST
    path: "/api/workspaces/{{ws}}/projects/{{project_alpha}}/issues/{{issue_commented}}/comments/"
    jar: admin
    headers:
        Host: plane-fixture.test
        Cookie: "session-id={{session_admin}}"
    json: {"comment_html": "<p>Hello <strong>world</strong></p>", "comment_json": {"type": "doc"}, "access": "INTERNAL"}
    capture:
      - name: comment_new
        source: db
        table: issue_comments
        column: id
    expect_status: 201

