#
# Phase 5, work items set C: the sub-resource write routes.
#
#   POST   …/issues/{issue_id}/sub-issues/                       (73)
#   POST   …/issues/{issue_id}/issue-links/                      (74)
#   PATCH  …/issues/{issue_id}/issue-links/{pk}/                 (75)
#   DELETE …/issues/{issue_id}/issue-links/{pk}/                 (75)
#   POST   …/issues/{issue_id}/issue-subscribers/                (83)
#   DELETE …/issues/{issue_id}/issue-subscribers/{subscriber}/   (84)
#   POST   …/issues/{issue_id}/subscribe/                        (85)
#   DELETE …/issues/{issue_id}/subscribe/                        (85)
#   POST   …/issues/{issue_id}/issue-relation/                   (93)
#   POST   …/issues/{issue_id}/remove-relation/                  (94)
#
# Covers every success path, the serializer errors, the permission matrix
# (guest, inactive member, non-member, foreign workspace), the duplicates and
# repeats (link URL, relation pair, subscriber row, subscribe) and the
# follow-up GETs that show what was actually written.
#
# The ported upstream behaviours these steps pin:
#   * sub-issues: the `{sub_issues, state_distribution}` body and the
#     `current_instance` that names the sub-issue itself as its parent;
#   * links: the `http://` prefix on the raw url, `URLValidator`'s field error
#     body, `deleted_at` being writable, and the 404 the `create` response
#     query answers for an archived project;
#   * subscribers: the duplicate POST is the family 400 (no pre-check), the
#     `destroy`/`unsubscribe` lookups are `ObjectDoesNotExist` 404s;
#   * relations: the reverse-type mapping, the mirrored rows and
#     `remove-relation`'s two-direction lookup.
#
# Fixture: ALP `b0063033…` (ALPHA-003 `b5ca265c…` has no links/subscribers,
# ALPHA-010 `d432015f…` already has a link and subscribers, ALPHA-012
# `d66a8985…` blocks ALPHA-013 `b2387b6f…`), GAM `4f9d99bc…` archived,
# EPS `2e199eb6…` a sibling project for the cross-project cases.

