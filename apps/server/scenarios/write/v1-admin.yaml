  # `update()` passes the `State` instance to a UUID lookup, which is a core
  # `ValidationError` → the family's 400, not the view's 409
  # (`project.py:194-199`, `plane/api/views/base.py:85-89`).
  - name: v1a-309-patch-foreign-default-state-400
    method: PATCH
    path: "/api/v1/workspaces/{{ws}}/projects/{{project_new}}/"
    jar: api_member
