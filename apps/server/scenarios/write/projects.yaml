  - name: write-projects-25-create-several-invalid
    method: POST
    path: "/api/workspaces/{{ws}}/projects/"
    json:
      name: "Bad, name"
      identifier: "ABCDEFGHIJKLM"
      network: 1
      archive_in: 20
      timezone: "Nowhere/Fake"
