    method: PATCH
    path: "/api/workspaces/{{ws}}/projects/{{project_alpha}}/"
    json:
      inbox_view: true
    jar: admin
    headers:
      Host: plane-fixture.test
      Cookie: "session-id={{session_admin}}"

  # --- PATCH: validation ---------------------------------------------------
  - name: write-projects-35-patch-name-blank
    method: PATCH
    path: "/api/workspaces/{{ws}}/projects/{{project_full}}/"
