  # --- create: field validation -------------------------------------------
  - name: write-projects-08-create-empty
    method: POST
    path: "/api/workspaces/{{ws}}/projects/"
    json: {}
    jar: admin
    headers:
      Host: plane-fixture.test
      Cookie: "session-id={{session_admin}}"
