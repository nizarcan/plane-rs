    path: "/api/workspaces/{{ws}}/projects/"
    json:
      name: "   "
      identifier: "BLK1"
    jar: admin
    headers:
      Host: plane-fixture.test
      Cookie: "session-id={{session_admin}}"
    expect_status: 400
  - name: write-projects-17-create-name-bool
    method: POST
    path: "/api/workspaces/{{ws}}/projects/"
    json:
      name: true
      identifier: "BOOL1"
    jar: admin
    headers:
      Host: plane-fixture.test
      Cookie: "session-id={{session_admin}}"
    expect_status: 400
  - name: write-projects-18-create-description-null
    method: POST
    path: "/api/workspaces/{{ws}}/projects/"
    json:
      name: "Null description"
      identifier: "NULD"
      description: null
    jar: admin
    headers:
      Host: plane-fixture.test
      Cookie: "session-id={{session_admin}}"
    expect_status: 400
  - name: write-projects-19-create-network-invalid
    method: POST
    path: "/api/workspaces/{{ws}}/projects/"
    json:
      name: "Bad network"
      identifier: "NET1"
      network: 1
    jar: admin
    headers:
      Host: plane-fixture.test
      Cookie: "session-id={{session_admin}}"
    expect_status: 400
  - name: write-projects-20-create-archive-in-high
    method: POST
    path: "/api/workspaces/{{ws}}/projects/"
    json:
      name: "Archive too high"
      identifier: "ARC1"
      archive_in: 13
    jar: admin
    headers:
      Host: plane-fixture.test
      Cookie: "session-id={{session_admin}}"
    expect_status: 400
  - name: write-projects-21-create-close-in-low
    method: POST
    path: "/api/workspaces/{{ws}}/projects/"
    json:
      name: "Close too low"
      identifier: "CLS1"
      close_in: -1
    jar: admin
    headers:
      Host: plane-fixture.test
      Cookie: "session-id={{session_admin}}"
    expect_status: 400
  - name: write-projects-22-create-timezone-invalid
