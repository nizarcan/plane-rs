  - name: write-projects-09-create-null-body
    method: POST
    path: "/api/workspaces/{{ws}}/projects/"
    # `json: null` means "no body" to the harness; this is the JSON `null`
    # literal. `create` builds `data={**request.data}`, so a non-mapping body
    # raises TypeError inside the view — Plane's generic 500.
    body: "null"
    jar: admin
    headers:
      Host: plane-fixture.test
      Content-Type: "application/json"
      Cookie: "session-id={{session_admin}}"
    expect_status: 500
  - name: write-projects-10-create-list-body
