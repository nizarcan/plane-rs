  - name: write-projects-27-create-nonmember
    method: POST
    path: "/api/workspaces/{{ws}}/projects/"
    json:
      name: "Non-member project"
      identifier: "NONM"
    jar: nonmember
    headers:
      Host: plane-fixture.test
      Cookie: "session-id={{session_nonmember}}"
    expect_status: 403
  - name: write-projects-28-create-wrong-origin
    method: POST
    path: "/api/workspaces/{{ws}}/projects/"
    json:
      name: "CSRF project"
      identifier: "CSRF"
    jar: admin
    headers:
      Host: plane-fixture.test
      Cookie: "session-id={{session_admin}}"
