    expect_status: 403
  - name: write-projects-29-create-no-origin
    method: POST
    path: "/api/workspaces/{{ws}}/projects/"
    json:
      name: "No origin"
      identifier: "NORG"
    jar: admin
    headers:
      Host: plane-fixture.test
      Cookie: "session-id={{session_admin}}"
    origin: false
    expect_status: 201
    capture:
      - name: project_no_origin
        source: db
        table: projects
        column: id

  # --- PATCH: identifier and timezone (H09a) -------------------------------
  - name: write-projects-30-patch-identifier
    method: PATCH
    path: "/api/workspaces/{{ws}}/projects/{{project_alpha}}/"
    json:
      identifier: "alp2"
