    path: "/api/workspaces/{{ws}}/projects/"
    json:
      name: "Long identifier"
      identifier: "ABCDEFGHIJKLM"
    jar: admin
    headers:
      Host: plane-fixture.test
      Cookie: "session-id={{session_admin}}"
    expect_status: 400
  - name: write-projects-15-create-name-null
