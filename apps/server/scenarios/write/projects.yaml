  # --- create: permission matrix and origin --------------------------------
  - name: write-projects-26-create-guest
    method: POST
    path: "/api/workspaces/{{ws}}/projects/"
    json:
      name: "Guest project"
      identifier: "GUEST"
    jar: guest
    headers:
      Host: plane-fixture.test
      Cookie: "session-id={{session_guest}}"
