    expect_status: 400

  - name: ait-52-list-body
    method: POST
    path: "/api/workspaces/{{ws}}/ai-assistant/"
    jar: admin
    headers: { Host: plane-fixture.test, Cookie: "session-id={{session_admin}}" }
    json: []
    expect_status: 500

  - name: ait-52-malformed-body
    method: POST
    path: "/api/workspaces/{{ws}}/ai-assistant/"
    jar: admin
    headers:
      Host: plane-fixture.test
      Cookie: "session-id={{session_admin}}"
      Content-Type: application/json
    body: '{"task": '
    expect_status: 400

  - name: ait-52-int-task
    method: POST
    path: "/api/workspaces/{{ws}}/ai-assistant/"
    jar: admin
    headers: { Host: plane-fixture.test, Cookie: "session-id={{session_admin}}" }
    json: { task: 5 }
    expect_status: 500

  - name: ait-52-missing-prompt
    method: POST
    path: "/api/workspaces/{{ws}}/ai-assistant/"
    jar: admin
    headers: { Host: plane-fixture.test, Cookie: "session-id={{session_admin}}" }
