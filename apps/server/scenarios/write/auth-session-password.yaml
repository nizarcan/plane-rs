#
# Auth session set A — the signed-in password routes:
#
#   POST  /auth/change-password/   (383)  IsAuthenticated + AuthenticationThrottle
#   POST  /auth/set-password/      (384)  IsAuthenticated + AnonRateThrottle
#
# Branches:
#
#   * change-password as a non-autoset account: missing old
#     (`MISSING_PASSWORD`, "Old password is missing"), missing new ("Old or new
#     password is missing"), a wrong old (`INCORRECT_OLD_PASSWORD`), a weak new
#     (`PASSWORD_TOO_WEAK`), and success;
#   * the same-user re-login: the session auth hash no longer matches after
#     `set_password`, so `login()` flushes the store — the session row and cookie
#     change and `rotate_token` issues a new CSRF secret, so the old masked token
#     is rejected by DRF's stock `SessionAuthentication` and the new one is
#     accepted;
#   * set-password as an autoset account: `PASSWORD_ALREADY_SET` for a
#     non-autoset caller, `INVALID_PASSWORD` for a missing/weak password, and the
#     39-key `UserSerializer` body on success (with `?fields=id`, which the base
#     serializer does not filter);
#   * unauthenticated change/set-password are 401 before any throttle.

name: write-auth-session-password
template_db: plane_tpl
redis_db: [3, 4]
target_env:
  AUTHENTICATION_RATE_LIMIT: "1000/minute"
vars:
  fixture_sql: "{repo}/apps/server/scenarios/write/auth-session-password-fixture.sql"
  fixture_password: Auth-Fixture-Passw0rd-2026!
  new_password: Diff-Test-Changed-2026-N3w!
password_vars:
  - fixture_password
  - new_password
steps:
  - name: password-csrf
    method: GET
    path: /auth/get-csrf-token/
    jar: password
    expect_status: 200

  - name: password-sign-in
    method: POST
    path: /auth/sign-in/
    jar: password
    form:
      email: password-user@example.com
      password: "{{fixture_password}}"
    expect_status: 302

  # `login()` rotated the CSRF secret; fetch the current token and capture the
  # cookie secret so a stale one can be replayed after the change.
  - name: password-csrf-after-sign-in
    method: GET
    path: /auth/get-csrf-token/
    jar: password
    expect_status: 200
    capture:
      - name: csrf_before_change
        source: cookie
        cookie: csrftoken

  - name: change-password-unauthenticated
    method: POST
    path: /auth/change-password/
    jar: anonymous
    json:
      old_password: "{{fixture_password}}"
      new_password: "{{new_password}}"
    expect_status: 401

  - name: change-password-missing-old
    method: POST
    path: /auth/change-password/
    jar: password
    json:
      new_password: "{{new_password}}"
    expect_status: 400

  - name: change-password-wrong-old
    method: POST
    path: /auth/change-password/
    jar: password
    json:
      old_password: not-the-old-password
      new_password: "{{new_password}}"
    expect_status: 400

  - name: change-password-missing-new
    method: POST
    path: /auth/change-password/
    jar: password
    json:
      old_password: "{{fixture_password}}"
    expect_status: 400

  - name: change-password-weak-new
    method: POST
    path: /auth/change-password/
    jar: password
    json:
      old_password: "{{fixture_password}}"
      new_password: "123456"
    expect_status: 400

  - name: change-password-success
    method: POST
    path: /auth/change-password/
    jar: password
    json:
      old_password: "{{fixture_password}}"
      new_password: "{{new_password}}"
    expect_status: 200

  # The captured secret predates the rotation; the jar's cookie is the new one.
  - name: change-password-stale-csrf
    method: POST
    path: /auth/change-password/
    jar: password
    headers:
      X-CSRFToken: "{{csrf_before_change}}"
    json:
      old_password: "{{new_password}}"
      new_password: "{{new_password}}"
    expect_status: 403

  - name: me-after-change
    method: GET
    path: /api/users/me/
    jar: password
    expect_status: 200

  # The old password no longer signs in; the new one does.
  - name: old-password-csrf
    method: GET
    path: /auth/get-csrf-token/
    jar: old-password
    expect_status: 200

  - name: new-password-csrf
    method: GET
    path: /auth/get-csrf-token/
    jar: new-password
    expect_status: 200

  - name: sign-in-old-password
    method: POST
    path: /auth/sign-in/
    jar: old-password
    form:
      email: password-user@example.com
      password: "{{fixture_password}}"
    expect_status: 302

  - name: sign-in-new-password
    method: POST
    path: /auth/sign-in/
    jar: new-password
    form:
      email: password-user@example.com
      password: "{{new_password}}"
    expect_status: 302

  # --- set-password on a non-autoset account ----------------------------
  - name: set-password-already-set
    method: POST
    path: /auth/set-password/
    jar: password
    json:
      password: "{{new_password}}"
    expect_status: 400

  # --- set-password on an autoset account -------------------------------
  - name: autoset-csrf
    method: GET
    path: /auth/get-csrf-token/
    jar: autoset
    expect_status: 200

  - name: autoset-sign-in
    method: POST
    path: /auth/sign-in/
    jar: autoset
    form:
      email: autoset-user@example.com
      password: "{{fixture_password}}"
    expect_status: 302

  - name: set-password-missing
    method: POST
    path: /auth/set-password/
    jar: autoset
    json: {}
    expect_status: 400

  - name: set-password-weak
    method: POST
    path: /auth/set-password/
    jar: autoset
    json:
      password: "123456"
    expect_status: 400

  # `?fields=id` is ignored: the base serializer has no dynamic fields.
  - name: set-password-success
    method: POST
    path: "/auth/set-password/?fields=id"
    jar: autoset
    json:
      password: "{{new_password}}"
    expect_status: 200

  - name: set-password-again
    method: POST
    path: /auth/set-password/
    jar: autoset
    json:
      password: "{{new_password}}"
    expect_status: 400

  - name: autoset-me
    method: GET
    path: /api/users/me/
    jar: autoset
    expect_status: 200
