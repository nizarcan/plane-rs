#
# Write scenario for the label routes (68, 69, 70). Generated from those orders
# by `tools/scenarios/gen_write.py`, then curated: H20 sort order, the two
# uniqueness checks (serializer `iexact` vs the PATCH exact pre-check), the
# soft-deleted-row constraints, PUT's missing serializer context, bulk-create's
# conflict handling, the cache invalidation decorators, and the permission
# matrix.
#
# `lb-` = labels.

name: write-labels
