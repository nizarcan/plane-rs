      Host: plane-fixture.test
      Cookie: "session-id={{session_admin}}"
    expect_status: 400

  # `update()`'s duplicate check excludes the row itself but sees the other
  # link in this module.
  - name: wmod-38-link-put-duplicate
    method: PUT
    path: "/api/workspaces/{{ws}}/projects/{{project_alpha}}/modules/{{module_backlog}}/module-links/{{link_a}}/"
    json:
      url: "https://example.com/second"
      title: "Duplicate"
