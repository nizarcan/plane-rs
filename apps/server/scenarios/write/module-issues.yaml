  - name: wmod-27-delete-module-issue-unknown
    method: DELETE
    path: "/api/workspaces/{{ws}}/projects/{{project_alpha}}/modules/{{module_planned}}/issues/{{unknown_issue}}/"
    jar: admin
    headers:
      Host: plane-fixture.test
      Cookie: "session-id={{session_admin}}"
