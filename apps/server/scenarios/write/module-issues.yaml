  - name: wmod-21-set-modules-nonmember-denied
    method: POST
    path: "/api/workspaces/{{ws}}/projects/{{project_alpha}}/issues/{{issue_006}}/modules/"
    json:
      modules: ["{{module_backlog}}"]
    jar: outsider
    headers:
      Host: plane-fixture.test
      Cookie: "session-id={{session_nonmember}}"
    expect_status: 403

  - name: wmod-22-set-modules-foreign-origin
    method: POST
    path: "/api/workspaces/{{ws}}/projects/{{project_alpha}}/issues/{{issue_006}}/modules/"
    json:
      modules: ["{{module_backlog}}"]
    jar: admin
    headers:
      Host: plane-fixture.test
      Cookie: "session-id={{session_admin}}"
    origin: "http://evil.example"
    expect_status: 403

  # A member may write too.
  - name: wmod-23-set-modules-member
    method: POST
    path: "/api/workspaces/{{ws}}/projects/{{project_alpha}}/issues/{{issue_006}}/modules/"
    json:
      modules: ["{{module_backlog}}"]
    jar: member
    headers:
      Host: plane-fixture.test
      Cookie: "session-id={{session_member}}"
    expect_status: 201

  # --- module issues: remove (107) -----------------------------------------
  - name: wmod-24-delete-module-issue
    method: DELETE
    path: "/api/workspaces/{{ws}}/projects/{{project_alpha}}/modules/{{module_planned}}/issues/{{issue_007}}/"
    jar: admin
    headers:
