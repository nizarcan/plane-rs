  # --- module issues: add (106) --------------------------------------------
  # Eleven new issues: one `bulk_create` call, two batches (10 + 1).
  - name: wmod-01-add-eleven
    method: POST
    path: "/api/workspaces/{{ws}}/projects/{{project_alpha}}/modules/{{module_planned}}/issues/"
    json:
      issues: ["{{issue_002}}", "{{issue_003}}", "{{issue_006}}", "{{issue_007}}", "{{issue_008}}", "{{issue_009}}", "{{issue_012}}", "{{issue_013}}", "{{issue_014}}", "{{issue_016}}", "{{issue_017}}"]
    jar: admin
    headers:
      Host: plane-fixture.test
      Cookie: "session-id={{session_admin}}"
    expect_status: 201

  # Re-add: `ignore_conflicts` skips every row, the activities fire again.
