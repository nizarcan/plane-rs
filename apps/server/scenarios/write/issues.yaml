#
# Phase 5: the issue-core write routes (`plans/WORK_ITEMS.md` set A).
#
#   POST   /api/workspaces/{slug}/projects/{project_id}/issues/             (64)
#   PATCH  /api/workspaces/{slug}/projects/{project_id}/issues/{pk}/        (67)
#   DELETE /api/workspaces/{slug}/projects/{project_id}/issues/{pk}/        (67)
#   PUT    /api/workspaces/{slug}/projects/{project_id}/issues/{pk}/        (67, 405)
#   DELETE /api/workspaces/{slug}/projects/{project_id}/bulk-delete-issues/ (71)
#   POST   /api/workspaces/{slug}/projects/{project_id}/bulk-archive-issues/ (72)
#   POST   /api/workspaces/{slug}/projects/{project_id}/issues/{pk}/archive/ (92)
#   DELETE /api/workspaces/{slug}/projects/{project_id}/issues/{pk}/archive/ (92)
#   POST   /api/workspaces/{slug}/projects/{project_id}/issue-dates/        (96)
#
# Covers: minimal/full creates (defaults, default state, default assignee,
# empty/filtered assignees, filtered labels, read-only fields, sanitised HTML),
# the validation matrix (required/blank/length, point/priority/date choices,
# start>target, state/parent/estimate project checks, triage and soft-deleted
# state/parent, list-field indexed errors, null/list bodies), sequences across
# several creates, the permission matrix, and the origin check.
#
# PATCH: state transitions (completed -> completed_at set, away -> cleared,
# NULL -> untouched), assignee/label replacement (including empty), HTML
# sanitisation, read-only fields including `is_draft`, `skip_activity` with and
# without `description_html`, the three tasks in order, empty and unknown-key
# bodies, the member/guest matrix, foreign-project/soft-deleted/unknown 404s,
# a non-mapping 500, and PUT's 405.
#
# DELETE: creator shortcut, member/guest refusals, archived/soft-deleted
# lookups, hard-deleted recent visits, and GET after delete.
# archive/unarchive: the completed/cancelled rule, the issue_objects lookup
# (triage/draft/archived/archived-project 404s) and the Issue.objects unarchive
# lookup. bulk archive: partial-then-400 (the first activity is published and
# no archived_at update), success, unknown/empty ids, triage 400, member/guest.
# bulk delete: cycle/module/issue soft deletes in one request, GET after.
# issue-dates: both fields, one field, current-value validation, start>target
# 400, unknown/missing ids, duplicate-id mutation, and an invalid date's 500.
#
# Fixture anchors: ALPHA `b0063033…` (default state Backlog `5943efbb…`,
# default assignee member `78100240…`), BETA `ca8f652c…`, archived GAMMA
# `4f9d99bc…`. Completed ALPHA issue `b5ca265c…`, started `292d4433…`,
# cancelled+archived `e956b8e9…`, triage `85385456…`, draft `e069169e…`,
# soft-deleted `0c82df87…`. Sessions: admin `d44ae570…`, member `78100240…`,
# guest `31a752d6…`, nonmember `e15c61cc…`.

