#
# Set D write scenario: the v1 work-item list/create and detail write routes
# (317/329 POST, 318/330 PATCH and DELETE). The read routes are covered by
# scenarios/read/v1.yaml; sub-resource writes are not ported yet, so this file
# does not exercise them.
#
# Every step runs Django vs Django until the routes flip to Rust, then Django vs
# Rust. `PYTHONHASHSEED` is pinned for the same reason as the read scenario: the
# serializer validation error lists iterate Python sets.
name: write-v1-work-items
template_db: plane_fix_tpl
redis_db: [6, 7]
target_env:
  PYTHONHASHSEED: "0"
vars:
  ws: "fix-workspace"
  project_alpha: "b0063033-54f9-49d8-b5f3-6b7a1551c6a6"
  label_alpha_bug: "51298d1d-71da-4345-baa7-3c68b16b1f00"
  project_member_alpha_member: "78100240-9cfd-4782-8627-25ab039c6e9a"
  state_alpha_todo: "84b8f4a5-ed93-4af3-9817-e96436360ca3"
  api_token_active: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
  api_token_member: "bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"
steps:
  - name: issue-create-minimal
    method: POST
    path: "/api/v1/workspaces/{{ws}}/projects/{{project_alpha}}/issues/"
    jar: api_admin
    headers:
      Host: plane-fixture.test
      X-API-Key: "{{api_token_active}}"
    json:
      name: "harness v1 issue"
      priority: "high"
      description_html: "<p>created by the v1 harness</p>"
    capture:
      - name: issue_new
        source: db
        table: issues
        column: id
    expect_status: 201

  - name: issue-create-full
    method: POST
    path: "/api/v1/workspaces/{{ws}}/projects/{{project_alpha}}/work-items/"
    jar: api_admin
    headers:
      Host: plane-fixture.test
      X-API-Key: "{{api_token_active}}"
    json:
      name: "harness v1 issue full"
      description_html: "<p>hi <mention-component id=\"{{project_member_alpha_member}}\" entity_name=\"user\"></mention-component></p>"
      priority: "low"
      start_date: "2026-11-01"
      target_date: "2026-11-30"
      state: "{{state_alpha_todo}}"
      assignees: ["{{project_member_alpha_member}}"]
      labels: ["{{label_alpha_bug}}"]
      external_source: "harness-v1"
      external_id: "harness-v1-1"
      is_draft: false
    capture:
      - name: issue_new_full
        source: db
        table: issues
        column: id
    expect_status: 201

  - name: issue-create-date-order
    method: POST
    path: "/api/v1/workspaces/{{ws}}/projects/{{project_alpha}}/issues/"
    jar: api_admin
    headers:
      Host: plane-fixture.test
      X-API-Key: "{{api_token_active}}"
    json:
      name: "harness bad dates"
      start_date: "2026-12-01"
      target_date: "2026-11-01"
    expect_status: 400

  - name: issue-create-empty-html
    method: POST
    path: "/api/v1/workspaces/{{ws}}/projects/{{project_alpha}}/issues/"
    jar: api_admin
    headers:
      Host: plane-fixture.test
      X-API-Key: "{{api_token_active}}"
    json:
      name: "harness empty html"
      description_html: ""
    expect_status: 400

  - name: issue-create-foreign-label
    method: POST
    path: "/api/v1/workspaces/{{ws}}/projects/{{project_alpha}}/issues/"
    jar: api_admin
    headers:
      Host: plane-fixture.test
      X-API-Key: "{{api_token_active}}"
    json:
      name: "harness foreign label"
      labels: ["00000000-0000-4000-8000-000000000000"]
    expect_status: 400

  - name: issue-create-not-member
    method: POST
    path: "/api/v1/workspaces/{{ws}}/projects/{{project_alpha}}/issues/"
    jar: api_member
    headers:
      Host: plane-fixture.test
      X-API-Key: "{{api_token_member}}"
    json:
      name: "harness member create"
    expect_status: 201
    capture:
      - name: issue_member
        source: db
        table: issues
        column: id

  - name: issue-detail-after-create
    method: GET
    path: "/api/v1/workspaces/{{ws}}/projects/{{project_alpha}}/issues/{{issue_new}}/"
    jar: api_admin
    headers:
      Host: plane-fixture.test
      X-API-Key: "{{api_token_active}}"
    expect_status: 200

  - name: issue-patch-name
    method: PATCH
    path: "/api/v1/workspaces/{{ws}}/projects/{{project_alpha}}/issues/{{issue_new}}/"
    jar: api_admin
    headers:
      Host: plane-fixture.test
      X-API-Key: "{{api_token_active}}"
    json:
      name: "harness v1 issue (edited)"
      priority: "urgent"
    expect_status: 200

  - name: issue-patch-description
    method: PATCH
    path: "/api/v1/workspaces/{{ws}}/projects/{{project_alpha}}/work-items/{{issue_new_full}}/"
    jar: api_admin
    headers:
      Host: plane-fixture.test
      X-API-Key: "{{api_token_active}}"
    json:
      description_html: "<p>edited <b>html</b></p>"
      assignees: []
      labels: []
    expect_status: 200

  - name: issue-patch-assignees
    method: PATCH
    path: "/api/v1/workspaces/{{ws}}/projects/{{project_alpha}}/issues/{{issue_new_full}}/"
    jar: api_admin
    headers:
      Host: plane-fixture.test
      X-API-Key: "{{api_token_active}}"
    json:
      assignees: ["{{project_member_alpha_member}}"]
      labels: ["{{label_alpha_bug}}"]
    expect_status: 200

  - name: issue-patch-not-member
    method: PATCH
    path: "/api/v1/workspaces/{{ws}}/projects/{{project_alpha}}/issues/{{issue_new}}/"
    jar: api_member
    headers:
      Host: plane-fixture.test
      X-API-Key: "{{api_token_member}}"
    json:
      name: "member edit"
    expect_status: 200

  - name: issue-delete
    method: DELETE
    path: "/api/v1/workspaces/{{ws}}/projects/{{project_alpha}}/issues/{{issue_new}}/"
    jar: api_admin
    headers:
      Host: plane-fixture.test
      X-API-Key: "{{api_token_active}}"
    expect_status: 204

  - name: issue-detail-after-delete
    method: GET
    path: "/api/v1/workspaces/{{ws}}/projects/{{project_alpha}}/issues/{{issue_new}}/"
    jar: api_admin
    headers:
      Host: plane-fixture.test
      X-API-Key: "{{api_token_active}}"
    expect_status: 404

  - name: issue-delete-member-own
    method: DELETE
    path: "/api/v1/workspaces/{{ws}}/projects/{{project_alpha}}/issues/{{issue_member}}/"
    jar: api_member
    headers:
      Host: plane-fixture.test
      X-API-Key: "{{api_token_member}}"
    expect_status: 204
