#
# Set D write scenario: the v1 work-item list/create and detail write routes
# (317/329 POST, 318/330 PATCH and DELETE) and the sub-resource writes
# (319/331 POST, 320/332 PATCH+DELETE, 321/333 POST, 322/334 PATCH+DELETE,
# 325/337 POST, 326/338 PATCH+DELETE, 339 POST). The sub-resource reads are in
# scenarios/read/v1-work-items.yaml.
#
# The tail of the file is the sub-resource block: links (create/duplicate URL/
# both `validate_url` rejections/patch/metadata/unknown/delete), comments
# (create/external-id 409/empty html/patch/external-id 409/unknown/delete
# twice), attachments (create/size+type rejections/external-id 409/not-uploaded
# GET/list/patch twice/delete) and relations (all reply shapes, the duplicate
# pair, an empty and an unknown issue list, the two serializer errors). The
# attachment steps exercise the presigned POST (DECISIONS.md D17) and the
# `file_assets` insert; the comment steps the `descriptions` rows and the
# `model_activity` webhook.
#
# Every step runs Django vs Django until the routes flip to Rust, then Django vs
# Rust. `PYTHONHASHSEED` is pinned for the same reason as the read scenario: the
# serializer validation error lists iterate Python sets.
name: write-v1-work-items
template_db: plane_fix_tpl
redis_db: [6, 7]
target_env:
  PYTHONHASHSEED: "0"
vars:
  ws: "fix-workspace"
  project_alpha: "b0063033-54f9-49d8-b5f3-6b7a1551c6a6"
  label_alpha_bug: "51298d1d-71da-4345-baa7-3c68b16b1f00"
  project_member_alpha_member: "78100240-9cfd-4782-8627-25ab039c6e9a"
  state_alpha_todo: "84b8f4a5-ed93-4af3-9817-e96436360ca3"
  issue_alpha: "292d4433-edc1-4f05-9cca-c6954821c078"
  issue_alpha_commented: "d432015f-5a0f-4904-a2eb-d8bfea948a29"
  api_token_active: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
  api_token_member: "bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"
  api_token_admin2: "1111111111111111111111111111111111111111111111111111111111111111"
  api_token_admin3: "2222222222222222222222222222222222222222222222222222222222222222"
steps:
  - name: issue-create-minimal
    method: POST
    path: "/api/v1/workspaces/{{ws}}/projects/{{project_alpha}}/issues/"
    jar: api_admin
    headers:
      Host: plane-fixture.test
      X-API-Key: "{{api_token_active}}"
    json:
      name: "harness v1 issue"
      priority: "high"
      description_html: "<p>created by the v1 harness</p>"
    capture:
      - name: issue_new
        source: db
        table: issues
        column: id
    expect_status: 201

