  # `IssueSerializer.validate`'s assignee filter (`plane/api/serializers/
  # issue.py:136-140`): a valid user who is not an active MEMBER-or-above of
  # the project is a 400 `non_field_errors` naming the UUID. The fixture's
  # nonmember is a real `users` row with no `project_members` row in ALP, so
  # the `PrimaryKeyRelatedField` resolves and only the membership rule fires.
  - name: issue-create-bad-assignee
    method: POST
    path: "/api/v1/workspaces/{{ws}}/projects/{{project_alpha}}/issues/"
    jar: api_admin
    headers:
      Host: plane-fixture.test
      X-API-Key: "{{api_token_active}}"
