      priority: "low"
      start_date: "2026-11-01"
      target_date: "2026-11-30"
      state: "{{state_alpha_todo}}"
      assignees: ["{{project_member_alpha_member}}"]
      labels: ["{{label_alpha_bug}}"]
      external_source: "harness-v1"
      external_id: "harness-v1-1"
