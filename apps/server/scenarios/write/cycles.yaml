#
# Cycles set A (cycle core) write scenario:
#
#   POST    /api/workspaces/{slug}/projects/{project_id}/cycles/                 (31)
#   PATCH   /api/workspaces/{slug}/projects/{project_id}/cycles/{pk}/            (32)
#   DELETE  /api/workspaces/{slug}/projects/{project_id}/cycles/{pk}/            (32)
#   PUT     the same route answers 405                                           (32)
#   POST    .../cycles/date-check/                                               (35)
#   POST    .../user-favorite-cycles/                                            (36)
#   DELETE  .../user-favorite-cycles/{cycle_id}/                                 (37)
#   PATCH   .../cycles/{cycle_id}/user-properties/                               (39)
#   POST    .../cycles/{cycle_id}/archive/                                       (40)
#   DELETE  .../cycles/{cycle_id}/archive/                                       (40)
#   POST    .../archived-cycles/ and .../archived-cycles/{pk}/ (both 500)        (41, 42)
#   DELETE  the same two routes (both 500)                                       (41, 42)
#
# Covers the timezone conversion (UTC, a Europe/Berlin DST-edge date, both-or
# neither, start>end), one-sided PATCH dates left unconverted, the
# completed-cycle guard, the archived-cycle guard, the missing/foreign-cycle
# 500s, date-check overlap/exclusion/bad format, favourites (duplicate 400,
# hard delete, 404), user properties (201 from the in-memory instance, null ->
# 400, missing row -> 404), archive/unarchive (the archive POST removes every
# user's favourite), the unconditional 41/42 500s, DELETE then GET, the
# permission matrix, and the foreign-origin 403.

name: write-cycles
template_db: plane_fix_tpl
redis_db: [10, 11]
target_env:
  PYTHONHASHSEED: "0"
vars:
  fixture_sql: "{repo}/apps/server/scenarios/write/cycles-fixture.sql"
  ws: "fix-workspace"
  project_alpha: "b0063033-54f9-49d8-b5f3-6b7a1551c6a6"
