    path: "/api/workspaces/{{ws}}/projects/{{project_zeta}}/estimates/"
    json:
      estimate: {}
      estimate_points: {}
    jar: admin
    headers:
      Host: plane-fixture.test
      Cookie: "session-id={{session_admin}}"
    expect_status: 400
    capture:
      - name: est_zeta_points_dict
        source: db
        table: estimates
        column: id

