#
# Write scenario for the project-member routes (139, 140, 141, 143, 144, 145,
# 146). Generated from routes 139,140,141,143,144,145,146 by
# `tools/scenarios/gen_write.py`, then curated: each step exercises one branch
# of the view the generated placeholder skipped.
#
# Runs Django vs Django until the write methods flip to Rust, then Django vs
# Rust. `pe-` = project members / invitations.

name: write-project-members
template_db: plane_fix_tpl
redis_db: [10, 11]
target_env:
  PYTHONHASHSEED: "0"
