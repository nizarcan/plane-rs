    method: POST
    path: "/api/workspaces/{{ws}}/projects/{{project_alpha}}/members/"
    jar: admin
    headers:
        Host: plane-fixture.test
        Cookie: "session-id={{session_admin}}"
    json: {"members": []}
    expect_status: 400

