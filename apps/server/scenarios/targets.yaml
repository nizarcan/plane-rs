# Targets for the differential harness.
#
# Each run starts two instances of the selected target. A target's command and
# environment are templates; the harness substitutes:
#
#   {port}       free port from `port_range`
#   {db}         database clone for this target (`dt_<run>_a` / `dt_<run>_b`)
#   {redis_db}   Redis logical database index for this target
#   {vhost}      RabbitMQ vhost for this target
#   {repo}       repository root
#
# The Django entry is backed by apps/server/dev/django-serve.sh, which reads
# PLANE_DB, PLANE_REDIS_DB and PLANE_MQ_VHOST (see apps/server/dev/README.md).
# Per-run target logs go to apps/server/target/difftest-logs/<run>/, which is
# gitignored.

targets:
  django:
    kind: django
    port_range: [18000, 18099]
    command:
      - "{repo}/apps/server/dev/django-serve.sh"
      - "{port}"
    env:
      PLANE_DB: "{db}"
      PLANE_REDIS_DB: "{redis_db}"
      PLANE_MQ_VHOST: "{vhost}"
      GUNICORN_WORKERS: "1"
    health: /api/instances/
    # gunicorn + uvicorn + the first request (template DB is already migrated)
    # take a few seconds; a cold start of the VM can take longer.
    health_timeout_secs: 90
    workdir: "{repo}"
