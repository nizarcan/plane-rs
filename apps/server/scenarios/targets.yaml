# Targets for the differential harness.
#
# Each run starts two instances of the selected target. A target's command and
# environment are templates; the harness substitutes:
#
#   {port}       free port from `port_range`
#   {db}         database clone for this target (`dt_<run>_a` / `dt_<run>_b`)
#   {redis_db}   Redis logical database index for this target
#   {vhost}      RabbitMQ vhost for this target
#   {repo}       repository root
#
# `secret_key_file` names the file the target reads SECRET_KEY from. The
# harness reads the same value to verify signed session payloads; it is never
# printed, logged or written into the report. `env_from` sources a shell script
# in a clean environment and passes every variable it exports to the target,
# with `env:` winning over it. Per-run target logs go to
# apps/server/target/difftest-logs/<run>/, which is gitignored.

targets:
  django:
    kind: django
    port_range: [18000, 18099]
    command:
      - "{repo}/apps/server/dev/django-serve.sh"
      - "{port}"
    env:
      PLANE_DB: "{db}"
      PLANE_REDIS_DB: "{redis_db}"
      PLANE_MQ_VHOST: "{vhost}"
      GUNICORN_WORKERS: "1"
    # apps/server/dev/.env.local is generated by dev/lib.sh (gitignored). The
    # template database's encrypted instance configuration is keyed off it, so
    # it is the one key every Django instance of the dev stack uses.
    secret_key_file: "{repo}/apps/server/dev/.env.local"
    secret_key_var: SECRET_KEY
    # A plain Django view with no database, cache or throttle side effects.
    # Probing an API endpoint would fill the Redis baseline (response cache,
    # anon throttle history) before the scenario starts, and a target that has
    # not ported those side effects yet would then differ on harness traffic
    # rather than on the scenario.
    health: /robots.txt
    # gunicorn + uvicorn + the first request (template DB is already migrated)
    # take a few seconds; a cold start of the VM can take longer.
    health_timeout_secs: 90
    workdir: "{repo}"

  # The Rust server, once bins/plane-api can serve the scenario. It gets the
  # same environment Django gets from apps/server/dev/django-env.sh (sourced
  # with this target's PLANE_DB / PLANE_REDIS_DB / PLANE_MQ_VHOST) plus its own
  # bind address. For a release binary, point `command[0]` at
  # apps/server/target/release/plane-api.
  rust:
    kind: rust
    port_range: [18100, 18199]
    command:
      - "{repo}/apps/server/target/debug/plane-api"
    env_from: "{repo}/apps/server/dev/django-env.sh"
    env:
      PLANE_RS_BIND: "127.0.0.1:{port}"
    secret_key_file: "{repo}/apps/server/dev/.env.local"
    secret_key_var: SECRET_KEY
    health: /
    health_timeout_secs: 60
    workdir: "{repo}"
