#
# Extra differential cases for the issue *sub-resource* routes ported under
# `crates/plane-http-app/src/issues/sub_*.rs` (routes 74-77, 80-83, 85, 86, 88,
# 93, 97-100). The generated `issues.yaml` covers one step per route/session;
# this file adds the shapes it misses:
#
#   * every relation type, from both sides of the pair (each fixture relation
#     uses a different issue, so one call per issue is needed);
#   * version and description-version detail for every fixture row;
#   * an issue/comment with zero rows of the sub-resource, and an unknown id;
#   * `activity_type=issue-property` / `issue-comment` and the
#     `created_at__gt` filter forms (date-only, offset, invalid, empty);
#   * the `django-filter` parameters of the comments list;
#   * guests (restricted in ALP/BET, unrestricted in EPS) and every timezone
#     fixture user, so `DateTimeField` rendering and the `last_saved_at`
#     exception of `global_paginator` are exercised;
#   * the paginator's malformed, zero-size and negative cursors.
#
# All steps are GETs: nothing here writes, so the order is irrelevant.
#
#   ./target/debug/difftest run --scenario scenarios/read/issues-sub-extra.yaml \
#     --a django --b rust

name: read-issues-sub-extra
template_db: plane_fix_tpl
