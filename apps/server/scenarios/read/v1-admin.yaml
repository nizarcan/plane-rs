      X-API-Key: "{{api_token_admin3}}"
  - name: v1a-296-project-member-detail-alias
    method: GET
    path: "/api/v1/workspaces/{{ws}}/projects/{{project_alpha}}/project-members/{{project_member_alpha_member}}/"
    jar: api_member2
    headers:
      Host: plane-fixture.test
      X-API-Key: "{{api_token_member2}}"
  - name: v1a-293-project-member-detail-wrong-project
    method: GET
    path: "/api/v1/workspaces/{{ws}}/projects/{{project_alpha}}/members/{{project_member_beta_member}}/"
    jar: api_admin2
    headers:
      Host: plane-fixture.test
      X-API-Key: "{{api_token_admin2}}"
  - name: v1a-295-project-members-lite
    method: GET
    path: "/api/v1/workspaces/{{ws}}/projects/{{project_alpha}}/project-members-lite/"
    query:
      per_page: "4"
    jar: api_admin2
    headers:
      Host: plane-fixture.test
      X-API-Key: "{{api_token_admin2}}"
  - name: v1a-295-project-members-lite-unknown-project
    method: GET
    path: "/api/v1/workspaces/{{ws}}/projects/00000000-0000-4000-8000-000000000002/project-members-lite/"
    jar: api_admin2
