  - name: v1a-309-project-detail-member-token
    method: GET
    path: "/api/v1/workspaces/{{ws}}/projects/{{project_alpha}}/"
    jar: api_member3
    headers:
      Host: plane-fixture.test
      X-API-Key: "{{api_token_member3}}"

  # -- 311 GET ws/projects/{project_id}/summary/ ---------------------------
  # The default (no `fields=`) body has eight set-ordered keys; its bytes feed
  # the `process_logs` Celery payload, which the harness compares as a string
  # and cannot normalise. One-key and ascending-order subsets are used here so
  # the payload is deterministic; the eight-key shape is covered by
  # `scenarios/normalize.yaml`'s `$.counts` rule on any other request.
  - name: v1a-311-summary-one-field
    method: GET
    path: "/api/v1/workspaces/{{ws}}/projects/{{project_alpha}}/summary/"
    query:
      fields: "issues"
    jar: api_admin
    headers:
      Host: plane-fixture.test
      X-API-Key: "{{api_token_admin2}}"
  - name: v1a-311-summary-fields
    method: GET
    path: "/api/v1/workspaces/{{ws}}/projects/{{project_alpha}}/summary/"
    query:
      fields: "issues,members,unknown"
    jar: api_admin
    headers:
      Host: plane-fixture.test
      X-API-Key: "{{api_token_admin2}}"
  # `WorkSpaceAdminPermission` is roles 20/15, not owner-only
  # (`plane/utils/permissions/workspace.py:61-72`), so a member passes.
  - name: v1a-311-summary-member-allowed
    method: GET
    path: "/api/v1/workspaces/{{ws}}/projects/{{project_alpha}}/summary/"
    query:
      fields: "issues,members"
    jar: api_member2
    headers:
      Host: plane-fixture.test
      X-API-Key: "{{api_token_member2}}"
  - name: v1a-311-summary-bot-forbidden
    method: GET
    path: "/api/v1/workspaces/{{ws}}/projects/{{project_alpha}}/summary/"
    jar: api_bot
    headers:
      Host: plane-fixture.test
      X-API-Key: "{{api_token_bot}}"
  - name: v1a-297-workspace-members-bot-forbidden
    method: GET
    path: "/api/v1/workspaces/{{ws}}/members/"
    jar: api_bot
    headers:
      Host: plane-fixture.test
      X-API-Key: "{{api_token_bot}}"
  - name: v1a-311-summary-unknown-project
    method: GET
    path: "/api/v1/workspaces/{{ws}}/projects/00000000-0000-4000-8000-000000000001/summary/"
    jar: api_admin
    headers:
      Host: plane-fixture.test
      X-API-Key: "{{api_token_admin2}}"

  # -- HEAD/OPTIONS on an `as_view(http_method_names=…)` route -------------
  # HEAD is deliberately absent: a HEAD 405 has an empty body and the harness
  # cannot gunzip one (PROGRESS.md, "testkit can't gunzip an empty gzip HEAD
  # body"). The contract suite covers HEAD.
  - name: v1a-307-projects-options
    method: OPTIONS
    path: "/api/v1/workspaces/{{ws}}/projects/"
    jar: api_admin2
    headers:
      Host: plane-fixture.test
      X-API-Key: "{{api_token_admin3}}"

