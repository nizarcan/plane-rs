      X-API-Key: "{{api_token_active}}"
  - name: v1a-294-project-members-alias
    method: GET
    path: "/api/v1/workspaces/{{ws}}/projects/{{project_alpha}}/project-members/"
    jar: api_member
    headers:
      Host: plane-fixture.test
