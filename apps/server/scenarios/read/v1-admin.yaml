      Host: plane-fixture.test
      X-API-Key: "{{api_token_admin3}}"

  # -- 314 GET /users/me/ --------------------------------------------------
  - name: v1a-314-users-me-admin
    method: GET
    path: "/api/v1/users/me/"
    jar: api_admin
    headers:
      Host: plane-fixture.test
      X-API-Key: "{{api_token_active}}"
  - name: v1a-314-users-me-member
    method: GET
    path: "/api/v1/users/me/"
    jar: api_member3
    headers:
      Host: plane-fixture.test
      X-API-Key: "{{api_token_member3}}"
  - name: v1a-314-users-me-expired
    method: GET
    path: "/api/v1/users/me/"
    jar: anon2
    headers:
      Host: plane-fixture.test
      X-API-Key: "{{api_token_expired}}"

  # -- 340/342 invitations -------------------------------------------------
  - name: v1a-340-invitations-list
    method: GET
    path: "/api/v1/workspaces/{{ws}}/invitations/"
    jar: api_admin
    headers:
      Host: plane-fixture.test
      X-API-Key: "{{api_token_active}}"
  - name: v1a-340-invitations-list-member-forbidden
    method: GET
    path: "/api/v1/workspaces/{{ws}}/invitations/"
    jar: api_member3
    headers:
      Host: plane-fixture.test
      X-API-Key: "{{api_token_member3}}"
