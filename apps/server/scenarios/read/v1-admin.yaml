  # -- HEAD/OPTIONS on a BaseViewSet route --------------------------------
  # A `BaseViewSet` row keeps the default `http_method_names`, so OPTIONS
  # reaches `APIView.options` and answers the SimpleMetadata body. (The stickies
  # metadata carries a `background_color` schema property, which the
  # `json:background_color` shape rule rejects — the same pre-existing harness
  # limitation `PROGRESS.md` records for the OpenAPI renderings.)
  - name: v1a-340-invitations-options
    method: OPTIONS
    path: "/api/v1/workspaces/{{ws}}/invitations/"
    jar: api_admin2
    headers:
      Host: plane-fixture.test
      X-API-Key: "{{api_token_admin2}}"
