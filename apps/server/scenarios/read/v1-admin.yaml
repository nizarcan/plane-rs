      X-API-Key: "{{api_token_admin3}}"

  # -- 344/345 api roots ---------------------------------------------------
  - name: v1a-344-api-root-session
    method: GET
    path: "/api/v1/workspaces/{{ws}}/"
    jar: admin
    headers:
      Host: plane-fixture.test
      Cookie: "session-id={{session_admin}}"
