    method: GET
    path: "/api/v1/workspaces/{{ws}}/projects-lite/"
    jar: api_admin2
    headers:
      Host: plane-fixture.test
      X-API-Key: "{{api_token_admin2}}"
  - name: v1a-308-projects-lite-include-archived
    method: GET
    path: "/api/v1/workspaces/{{ws}}/projects-lite/"
