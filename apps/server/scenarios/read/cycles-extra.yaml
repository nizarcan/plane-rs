  cycle_alpha_past: "e6f4b40f-2492-4a1e-97f1-d84204ff65c1"
  cycle_alpha_upcoming: "1df0c827-94ce-419f-b6ed-4e69b69769ae"
  cycle_alpha_archived: "2aa0956c-78ad-4002-8d90-1232ff2ae659"
