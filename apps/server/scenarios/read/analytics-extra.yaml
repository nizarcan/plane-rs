#
# Extra `analytics` steps beyond the generated read scenario.
#
# What the generated cases cannot reach, and why each is here:
#
# * every `VALID_ANALYTICS_FIELDS` value in both roles — as the x axis and as
#   the segment — crossed with both `VALID_YAXIS` values, because the
#   aggregate's `SELECT` list and its `GROUP BY` differ per combination
#   (`plane/utils/analytics_plot.py:73-120`);
# * every accepted `date_filter`, including the `custom` value that filters
#   nothing because `get_analytics_date_range` never receives the custom
#   window's start/end (`plane/utils/date_utils.py:75-87`);
# * the caller's timezone, which moves both the naive-datetime windows
#   (`advance-analytics`) and the `AT TIME ZONE` date buckets
#   (`analytics`/`default-analytics`/chart `TruncMonth`): Berlin, Kolkata
#   (+05:30), New York and Tokyo. The shared fixture has no zone east of
#   Tokyo, so +13/+14 could not be exercised without rebuilding it;
# * `project`/`project_ids`, `cycle_id`/`module_id` (including both together,
#   an empty value and an invalid UUID), and the `custom-work-items` chart's
#   thirteen axis names with and without `group_by`;
# * every `requested_fields` shape of `project-stats`: the response's JSON key
#   order is CPython's `set` iteration order, so several subsets are pinned;
# * guests and admins on each route (guests are 403 on `analytics`,
#   `advance-analytics`, `advance-analytics-stats` and the project
#   `advance-analytics` pair, and 200 on the project chart).
#
# Run against the rich fixture template `plane_fix_tpl`:
#   ./target/debug/difftest run --scenario scenarios/read/analytics-extra.yaml \
#     --a django --b rust --targets /tmp/targets-rs-w2-analytics.yaml

name: read-analytics-extra
template_db: plane_fix_tpl
redis_db: [7, 8]
target_env:
  # `project-stats` writes its row keys in a Python `set`'s iteration order, so
  # JSON key order follows the process's string-hash seed. Pinning the seed
  # makes the two targets agree without normalising the body.
  PYTHONHASHSEED: "0"
