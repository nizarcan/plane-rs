#
# Hand-written read scenario for the v1 work-item routes of set D:
#
#   315/327  GET  ws/{issues,work-items}/search/            (search.rs)
#   316/328  GET  ws/{issues,work-items}/{ident}-{seq}/     (issues.rs)
#   317/329  GET  pr/{issues,work-items}/                   (issues.rs)
#   318/330  GET  pr/{issues,work-items}/{pk}/              (issues.rs)
#   319/331  GET  pr/{issues,work-items}/{issue_id}/links/  (issue_subresources.rs)
#   320/332  GET  .../links/{pk}/
#   321/333  GET  .../comments/
#   322/334  GET  .../comments/{pk}/
#   323/335  GET  .../activities/
#   324/336  GET  .../activities/{pk}/
#   325/337  GET  .../{issue-attachments,attachments}/
#   326/338  GET  .../{issue-attachments,attachments}/{pk}/
#   339      GET  pr/work-items/{issue_id}/relations/
#
# The generator (`tools/scenarios/gen_read.py`) owns `scenarios/read/v1.yaml`,
# which covers the v1 routes ported before this set; this file keeps the set-D
# steps out of that generated file, the same way `issues-sub-extra.yaml` keeps
# the hand-written app-surface cases. `scenarios/write/v1-work-items.yaml` has
# the writes.
#
# The token rotation is the generated file's: the v1 throttle keys on the raw
# token and one read pass issues more than 60 requests per role.
#
#   ./target/debug/difftest run --scenario scenarios/read/v1-work-items.yaml \
#     --a django --b rust --targets /tmp/targets-v1d.yaml \
#     --a-redis-db 3 --b-redis-db 4

name: read-v1-work-items
template_db: plane_fix_tpl
# Own Redis indexes: page caches and throttle histories only, but two agents
# sharing an index is the one way a clean scenario can flake.
redis_db: [6, 7]
target_env:
  # `IssueSearchEndpoint` builds a Python `Q`, not a set, but the work-item
  # validation errors and `ProjectSummary` do iterate sets elsewhere in v1;
