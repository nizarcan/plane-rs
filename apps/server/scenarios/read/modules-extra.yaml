#
# Extra `modules` steps beyond the generated read scenario: `fields=` (the
# list switches to `ModuleSerializer`), every module status, a project whose
# estimate is not of type `points`, users in other profile timezones, archived
# modules, links, the module issue list's filters/ordering/cursors/grouping and
# error paths, and the per-user properties `get_or_create`.
#
# The m2m group fields (`labels__id`, `assignees__id`,
# `issue_module__module_id`) are deliberately absent: the grouper builds their
# group-key order from a Python `set`, which `plane-query` documents as not
# reproducible (its golden corpus normalises it), so such a step could never be
# byte-identical. Their row *counts* on a registered route are covered through a
# non-m2m group over an m2m filter instead.
#
# Run against the rich fixture template `plane_fix_tpl`:
#   ./target/debug/difftest run --scenario scenarios/read/modules-extra.yaml \
#     --a django --b rust --targets /tmp/targets-rs-cycles-modules.yaml

name: read-modules-extra
template_db: plane_fix_tpl
redis_db: [12, 15]
target_env:
  # Some views build their response from a Python `set`, so JSON key order
  # follows the process's string-hash seed. Pinning the seed makes the two
  # targets agree without normalising the body.
  PYTHONHASHSEED: "0"
