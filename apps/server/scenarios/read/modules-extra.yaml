  project_alpha: "b0063033-54f9-49d8-b5f3-6b7a1551c6a6"
  project_beta: "ca8f652c-e89f-4c43-b91d-c2c6f9387509"
  project_theta: "08e2fc88-18a5-4758-87ec-5437bc0cf4bb"
  module_alpha_planned: "cac530e3-b832-4ca9-aef9-f4427b1a8f86"
  module_alpha_in_progress: "5e5035ff-8628-4833-87af-d4226f124c4f"
  module_alpha_paused: "3dd8a2b9-d24e-4946-b348-e17e2e9676ac"
  module_alpha_completed: "e03eff9f-ec87-4133-bee9-474d29c4d397"
  module_alpha_cancelled: "a9cd2566-6ca2-40a5-ad76-81abe779cb42"
  module_alpha_backlog: "c36df15d-45cc-4e0d-84cf-a2aed3cb5b37"
  module_alpha_archived: "710da01c-8e38-407d-bfce-f7674b644275"
  module_beta_in_progress: "381b0fc4-1835-4ec3-bf58-a946281dfc74"
