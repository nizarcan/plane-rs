      fields: "id,name,start_date,target_date,status,member_ids,description_text,total_issues,is_favorite,total_estimate_points"
    jar: admin
    headers:
      Host: plane-fixture.test
      Cookie: "session-id={{session_admin}}"
  - name: extra-modules-0002-list-fields-unknown
    method: GET
    path: "/api/workspaces/{{ws}}/projects/{{project_alpha}}/modules/"
