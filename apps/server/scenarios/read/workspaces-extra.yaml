#
# Hand-written extra cases for the `workspaces` group, run against the rich read
# fixture template `plane_fix_tpl`. It complements the generated
# `scenarios/read/workspaces.yaml`, which covers one request per identity per
# route; this file adds:
#
#   * response-cache-free idempotence of the two GETs that create rows
#     (`home-preferences/`, `sidebar-preferences/`): a second request must not
#     insert anything;
#   * `fields=` / `expand=` variants — these views never forward either to the
#     serializer, so the bodies must be identical to the plain request;
#   * five more users, so the same route renders in Europe/Berlin, Asia/Tokyo,
#     America/New_York and Pacific/Auckland (the generated file only has
#     UTC/Asia/Kolkata/Australia/Sydney callers, and no non-member beyond
#     `fix.nonmember`);
#   * wrong slugs and unknown/uppercase/absent `uuid:` path segments;
#   * the issue-list extras of `/user-issues/`: a second page, `order_by`,
#     filters, `group_by`/`sub_group_by` (including the 400 pair and an unknown
#     group field), and a target user that is not a workspace member;
#   * the upstream 500s: `user-stats/?priority=high` (an `issue_filters` lookup
#     that cannot resolve on `IssueSubscriber`) and the two routes whose handler
#     signature lacks the route's kwarg (already in the generated file, restated
#     here with the other identities);
#   * guest and non-member callers on the per-user endpoints.
#
# Sessions are the fixture's signed session rows, as in the generated file.

