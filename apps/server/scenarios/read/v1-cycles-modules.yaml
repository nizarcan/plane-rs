#
# Hand-written read scenario for the v1 cycle and module routes of set C:
#
#   279  GET  pr/cycles/                                  (cycles.rs)
#   280  GET  pr/cycles-lite/
#   281  GET  pr/cycles/{pk}/
#   282  GET  pr/cycles/{cycle_id}/cycle-issues/
#   283  GET  pr/cycles/{cycle_id}/cycle-issues/{issue_id}/
#   286  GET  pr/archived-cycles/
#   299  GET  pr/modules/
#   300  GET  pr/modules-lite/
#   301  GET  pr/modules/{pk}/
#   302  GET  pr/modules/{module_id}/module-issues/
#   305  GET  pr/archived-modules/
#
# The generator (`tools/scenarios/gen_read.py`) owns `scenarios/read/v1.yaml`,
# which mixes every v1 set and therefore cannot be clean until A-D have all
# landed; this file carries the set-C steps (copied verbatim from that file's
# generator, which is why the step numbers do not start at 1) plus the
# `fields=`/`expand=`/`cycle_view` variants that file does not cover. The
# writes are in `scenarios/write/v1-cycles-modules.yaml`.
#
# The token rotation is the generated file's: the v1 throttle keys on the raw
# token, and one pass would otherwise exceed 60 requests per token per minute.
#
#   ./target/debug/difftest run --scenario scenarios/read/v1-cycles-modules.yaml \
#     --a django --b rust --targets /tmp/targets-v1c.yaml \
#     --a-redis-db 5 --b-redis-db 6

