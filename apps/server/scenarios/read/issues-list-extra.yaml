  # ---------------------------------------------------------------------
  # LIKE escaping: `icontains` escapes `\`, `%` and `_` before wrapping the
  # term in `%` (django/db/backends/base/operations.py:516-518). Without the
  # escaping `name=_` matches every non-empty name and `name=%` every name at
  # all; the fixture has no name with a literal `%`/`_`/`\`, so the escaped
  # forms match nothing while the unescaped ones would match hundreds of rows.
  # `extra-like-name-plain` proves the filter still matches a real name.
  # ---------------------------------------------------------------------
