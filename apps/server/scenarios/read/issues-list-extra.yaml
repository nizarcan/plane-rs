#
# Hand-written read scenario for the issue *list* routes: the shapes the
# generated `issues.yaml` does not cover (every group_by/sub_group_by pair the
# allowlist accepts, every order_by value, cursor walks in both directions,
# the legacy filters the generated file omits, `fields=`/`expand=`, users in
# four timezones, the two guest variants, and the archived/deleted/draft
# lookups). Run Django-vs-Django first, then Django-vs-Rust:
#
#   ./target/debug/difftest run --targets /tmp/targets-rs-issues-list.yaml \
#     --scenario scenarios/read/issues-list-extra.yaml --a django --b django
#   ./target/debug/difftest run --targets /tmp/targets-rs-issues-list.yaml \
#     --scenario scenarios/read/issues-list-extra.yaml --a django --b rust

