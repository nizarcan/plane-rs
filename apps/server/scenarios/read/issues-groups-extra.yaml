#
# The m2m groupings of the four issue-list routes. `plane-query` emits the id
# arrays and, for a single m2m group, the group keys in ascending order, while
# Django builds them from `list(set(...))` (DECISIONS.md D16); the harness
# compares exactly those places as multisets / key sets
# (`scenarios/normalize.yaml`, `unordered_json_paths`). Everything else — ids,
# order, counts, `total_pages`, key order, empty groups — is exact.
#
# Covered per route: every m2m field as `group_by` with every other m2m field
# and with a non-m2m sub-group as `sub_group_by`, the reverse (a non-m2m group
# with an m2m sub-group), forward and backward cursor walks on an m2m page, a
# `?filters=` tree and a legacy filter combined with a grouping, an empty page
# (a filter that matches nothing) and a cursor past the last page.
#
#   ./target/debug/difftest run --targets /tmp/targets-rs-query-batch.yaml \
#     --scenario scenarios/read/issues-groups-extra.yaml \
#     --a django --b django --a-redis-db 12 --b-redis-db 15
#   ./target/debug/difftest run --targets /tmp/targets-rs-query-batch.yaml \
#     --scenario scenarios/read/issues-groups-extra.yaml \
#     --a django --b rust --a-redis-db 12 --b-redis-db 15

