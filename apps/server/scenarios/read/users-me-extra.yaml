#
# Extra read steps for the `users-me` route group. The generated
# `users-me.yaml` covers each route once per identity; this file adds the
# query-parameter and timezone shapes the views support:
#
#   * `fields=` / an empty `fields=` on the workspace list
#   * `owner=` (present, invalid UUID, well-formed but missing) and `search=`
#   * the activity paginator: every allowlisted `order_by`, `per_page`
#     boundaries/errors, cursor errors, a previous page and a page past the
#     end, and the negative-slice 500
#   * `month=` on the two graphs and the dashboard (0, 3, 13 and a
#     non-integer that Django answers with 500)
#   * 404s for another user's account/token and a missing workspace
#   * `Asia/Kolkata`, `Asia/Tokyo`, `America/New_York` and `Europe/Berlin`
#     sessions, so the datetime fields are rendered in four offsets
#
# Run it Django vs Django first (determinism), then Django vs Rust:
#
#   ./target/debug/difftest run --scenario scenarios/read/users-me-extra.yaml \
#     --a django --b django --a-redis-db 1 --b-redis-db 2

name: read-users-me-extra
template_db: plane_fix_tpl
redis_db: [1, 2]
target_env:
  # Several views build a response from a Python `set`; pin the hash seed so
  # both targets order it the same way (same reason as the generated file).
  PYTHONHASHSEED: "0"
