# Normalisation table for the differential harness.
#
# Every entry has a one-line `why` that is copied into the run report. The
# list is deliberately short: only values that are genuinely random or based
# on the wall clock belong here. The built-in rules (generated UUIDs,
# in-window timestamps, the target's own base URL and cookie expiry relative
# to the step clock) are documented in crates/plane-testkit/src/normalize.rs.
#
# A rule is applied per target, so target A's generated value only ever
# becomes the same placeholder as target B's independently generated value.
#
# Two rules make the comparison strict rather than forgiving:
#
#   * Every volatile value becomes a typed placeholder from one per-target
#     map (`<session:1>`, `<csrf-secret:1>`, `<username:1>`, ...). The same raw
#     value anywhere in the run - a cookie, a header, a JSON field, a database
#     column, a Celery argument, a Redis key or value - gets the same
#     placeholder, so a session cookie that does not match its row, or a
#     response that shows another user's username, is a DIFF.
#
#   * Every placeholder rule names a `shape` from the catalogue below, and the
#     value is checked against it on both targets *before* substitution. A
#     session key of the wrong length or alphabet is a DIFF, not a normalised
#     blob.
#
# The semantic checks are part of the rule they apply to: `session_payload`
# verifies the signature with the target's SECRET_KEY and compares the decoded
# dictionary; `check: csrf_masked` requires the masked token to unmask to the
# response's own `csrftoken` cookie; `password` re-derives the PBKDF2 hash from
# the plaintexts listed in the scenario's `password_vars`.

# Value shapes, verified before placeholdering. Each shape cites the Django
# code or observed value it comes from.
shapes:
  # plane/db/models/session.py:14-15,36-42:
  # VALID_KEY_CHARS = string.ascii_lowercase + string.digits,
  # get_random_string(128, VALID_KEY_CHARS), retried while the key exists.
  session_key:
    pattern: '^[a-z0-9]{128}$'
    why: "Django session key: get_random_string(128, ascii_lowercase + digits) (plane/db/models/session.py:14)"
  # django/middleware/csrf.py:44-46: CSRF_SECRET_LENGTH = 32,
  # CSRF_ALLOWED_CHARS = ascii_letters + digits. The cookie stores the secret.
  csrf_secret:
    pattern: '^[A-Za-z0-9]{32}$'
    why: "CSRF cookie secret: 32 characters over ascii_letters + digits (django/middleware/csrf.py:44)"
  # The masked token is mask + cipher over the same alphabet, 2 * 32 long.
  csrf_token:
    pattern: '^[A-Za-z0-9]{64}$'
    why: "masked CSRF token: 64 characters, two 32-character halves (django/middleware/csrf.py:46)"
  # plane/authentication/adapter/base.py:352: User(email=..., username=uuid.uuid4().hex)
  uuid_hex:
    pattern: '^[0-9a-f]{32}$'
    why: "new users get uuid.uuid4().hex as username (plane/authentication/adapter/base.py:352)"
  # plane/db/models/user.py:174: self.token = uuid.uuid4().hex + uuid.uuid4().hex
  api_token:
    pattern: '^[0-9a-f]{64}$'
    why: "users.token is two uuid4 hex strings when token_updated_at is set (plane/db/models/user.py:174)"
  # plane/utils/color.py:9: "#" + "".join(random.choices(string.hexdigits, k=6)).
  # string.hexdigits includes A-F, so upper case is legitimate and observed.
  hex_colour:
    pattern: '^#[0-9a-fA-F]{6}$'
    why: "get_random_color picks six characters from string.hexdigits, so the case is mixed (plane/utils/color.py:9)"
  # django/contrib/auth/hashers.py:313-350: PBKDF2PasswordHasher with a
  # 22-character salt (salt_entropy 128 bits / log2(62)) and a standard-base64
  # SHA-256 digest. "!" + 40 characters is Django's unusable-password marker.
  django_password_hash:
    pattern: '^(?:pbkdf2_sha256\$[0-9]{1,9}\$[A-Za-z0-9]{1,64}\$[A-Za-z0-9+/]{43}=|![A-Za-z0-9]{40})$'
    why: "Django PBKDF2PasswordHasher: algorithm$iterations$salt$base64-sha256 (django/contrib/auth/hashers.py:324)"
  # django/core/signing.py:230-301: value:base62-timestamp:base64url-signature;
  # a leading "." marks a zlib-compressed payload.
  signed_session:
    pattern: '^\.?[A-Za-z0-9_-]+:[0-9A-Za-z]+:[A-Za-z0-9_-]+$'
    why: "TimestampSigner layout is payload:timestamp:signature (django/core/signing.py:230)"
  # django/contrib/auth/models.py:get_session_auth_hash: salted_hmac(...).hexdigest()
  auth_user_hash:
    pattern: '^[0-9a-f]{64}$'
    why: "_auth_user_hash is a SHA-256 HMAC hexdigest of the salted password hash"
  # plane/db/models/deploy_board.py:14-15: anchor = models.CharField(default=get_anchor)
  # with get_anchor = lambda: uuid4().hex. A board created during a run gets a
  # value neither side can predict; a fixture board's anchor is identical.
  anchor_hex:
    pattern: '^[0-9a-f]{32}$'
    why: "deploy board anchor: uuid4().hex (plane/db/models/deploy_board.py:14-15)"
  # FileAsset.asset = f"{workspace.id}/{uuid4().hex}-{sanitize(filename)}"
  # (`plane/db/models/asset.py:20-25`); a fixture key is identical on both
  # sides, a newly uploaded one is not.
  asset_key:
    pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/[0-9a-f]{32}-.+$'
    why: "FileAsset.asset: workspace id + uuid4().hex + filename (plane/db/models/asset.py:20-25)"
  upload_policy:
    pattern: '^[A-Za-z0-9+/]+=*$'
    why: "base64 policy of a presigned POST (botocore signers.py:723-846)"
  upload_signature:
    pattern: '^[0-9a-f]{64}$'
    why: "SigV4 signature of a presigned POST policy"
  upload_date:
    pattern: '^[0-9]{8}T[0-9]{6}Z$'
    why: "SigV4 signing date of a presigned POST"
  upload_credential:
    pattern: '^[^/]+/[0-9]{8}/[a-z0-9-]+/s3/aws4_request$'
    why: "SigV4 credential scope of a presigned POST"
  # plane/app/views/page/base.py:332: `str(datetime.now())` — a naive local
  # datetime, space separator, microseconds only when non-zero.
  naive_datetime:
    pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2}:[0-9]{2}(?:\.[0-9]{1,6})?$'
    why: "str(datetime.now()): naive local datetime with a space separator (plane/app/views/page/base.py:332)"
  # plane/db/models/webhook.py:17-18: `"plane_wh_" + uuid4().hex`. The model's
  # default is `generate_token` (:38) and regenerate assigns a fresh one
  # (plane/app/views/webhook/base.py:118-119). The fixture's secrets are
  # `plane_wh_` + `stable(name).hex` (tools/fixtures/build.py:2688), so they
  # match the same shape and are identical on both sides.
  webhook_secret:
    pattern: '^plane_wh_[0-9a-f]{32}$'
    why: "Webhook.generate_token: 'plane_wh_' + uuid4().hex (plane/db/models/webhook.py:17-18)"
  # plane/app/views/estimate/base.py:29-31: generate_random_name() joins ten
  # `random.choice(string.ascii_lowercase)`. `:66` calls it eagerly on every
  # create and uses it when the body has no `name`, so the inserted row and the
  # response's `name` differ between two runs.
  estimate_random_name:
    pattern: '^[a-z]{10}$'
    why: "generate_random_name: 10 random lowercase ASCII letters (plane/app/views/estimate/base.py:29-31, :66)"

# Headers that are not part of the HTTP contract.
ignore_headers:
  # Wall-clock time of the response.
  - date
  # Names the implementation (gunicorn vs hyper); the contract does not cover it.
  - server
  # Changes whenever a volatile value of a different length is substituted.
  # The comparator still compares it whenever no normalisation was applied.
  - content-length

# Response headers whose value is clock-based and needs a rule. A header with
# no rule is compared after base-URL/UUID/timestamp substitution.
volatile_headers:
  # Asset downloads answer `302` to a presigned S3 GET URL
  # (`plane/app/views/asset/*.py` → `S3Storage.generate_presigned_url`). Django
  # (boto3) and `plane-storage` sign in the second they run, so the two targets
  # legitimately differ in `X-Amz-Date` and therefore in `X-Amz-Signature`; up
  # to two of thirteen steps per run straddle a second boundary. DECISIONS.md
  # D17: everything else is byte-identical, and each side's signature is
  # recomputed with that target's own credentials and date.
  - name: Location
    mode: presigned_url
    request: "*api/assets/*"
    why: "asset downloads redirect to a presigned S3 URL; D17 verifies each side's SigV4 signature with its own X-Amz-Date (plane/settings/storage.py:114-151)"
  - name: X-RateLimit-Reset
    mode: unix_time
    why: "int(now + throttle duration), an absolute Unix timestamp (plane/api/views/base.py:123-136)"
  # `cache_page` sets `Expires = http_date(now + page_timeout)` on a miss
  # (django/utils/cache.py:patch_response_headers). The wall-clock value
  # differs between the two targets, so it is compared as `<expires+Ns>` from
  # the step clock, rounded to 10 s - the same rule a cookie's `Expires` gets.
  # A cached hit serves the *stored* `Expires` unchanged, so the offset grows
  # with the age of the entry: `<expires+7200s>` right after the store,
  # `<expires+N+7200s>` N seconds later. Both targets therefore keep serving
  # the same offset for the same step, and a hit that re-derived the header
  # instead of serving the stored one is off by thousands of seconds.
  - name: Expires
    mode: http_date
    why: "cache_page writes http_date(now + 7200); the age from the step clock is what must match (django/utils/cache.py:patch_response_headers)"

# Two rules are built in rather than configurable, because both need something
# outside a single value:
#
#   * `Age` (cache_page hits) is `int(now) - int(stored_at)`
#     (django/middleware/cache.py:FetchFromCacheMiddleware.process_request).
#     Each target stores the page and observes the hit at its own wall-clock
#     instant, so the two can legitimately differ by one second; the comparator
#     accepts a difference of at most one and nothing else. One side sending
#     `Age` and the other not is always a difference: it means one side served
#     from the page cache and the other did not.
#
#   * Page-cache Redis keys live in different namespaces by design
#     (DECISIONS.md D5a): Django writes `views.decorators.cache.cache_page..`
#     plus a `cache_header..` registry entry and pickles a `Response` object;
#     Rust writes `plane_rs.cache_page.` and its own binary format. The
#     normaliser maps both page keys to `:1:<page-cache:<ttl-bucket>:<n>>`
#     (10-second buckets, so a millisecond of skew does not matter while a
#     3600 s timeout still differs from 7200 s), drops the value, and drops the
#     `cache_header..` registry key, which has no Rust counterpart. Presence
#     and TTL bucket are therefore compared; key names and values are not.

# Intermediate and final timestamps are compared to an exact value only when
# they fall outside [request start - slack, response end + slack].
timestamp_slack_secs: 2

# Django table schemas to snapshot.
db_schemas:
  - public
  - plane_jobs

# Tables that never participate in a step's side effects. Empty: the harness
# snapshots every table, which is what makes it able to catch an unexpected
# write anywhere.
db_exclude_tables: []

# DECISIONS.md D16. Django builds some response values by iterating a Python
# `set` of `str` values, whose order CPython randomises per process:
#
#   * `GroupedOffsetPaginator.__query_multi_grouper` and
#     `SubGroupedOffsetPaginator.__query_multi_grouper` replace an issue's
#     `label_ids` / `assignee_ids` / `module_ids` with
#     `list(result_group_mapping[...])` (plane/utils/paginator.py:352,579-602);
#   * `GroupedOffsetPaginator.__query_multi_grouper` builds its result dict by
#     iterating those same sets (plane/utils/paginator.py:355,365), so the
#     *group key order* of a single m2m-grouped page is set order too.
#
# Rust emits both in ascending order (stable and cheap). `unordered_json_paths`
# compares exactly those places as multisets / key sets: `mode: array` sorts the
# elements, so a missing, extra or duplicated element still differs;
# `mode: object_keys` ignores the key order but still compares the key set and
# every value. `path` is a JSON-document glob (`*` = one component, `**` = any
# number); `request` limits a rule to the steps whose `METHOD path?query`
# matches, so no other endpoint is weakened.
#
# Every array and parent-key rule names the m2m grouper that builds it. On a
# page grouped by an ordinary column (`group_by=state_id`, `priority`, …) the
# same arrays are plain `ARRAY_AGG(DISTINCT …)` output and the raw column is a
# real column, so those pages stay an exact comparison; only
# `plane/utils/paginator.py:352,355,579-605` is exempt. `request:
# "*group_by=<m2m>*"` also matches `sub_group_by=<m2m>` — `sub_group_by` contains
# the substring `group_by=` — which is what the sub-grouped page needs: the
# `SubGroupedOffsetPaginator.__query_multi_grouper` replaces only the m2m
# field's own mapper array (`paginator.py:597-606`), so each rule is scoped to
# its own column.
unordered_json_paths:
  # Single-group m2m page: the arrays of an issue inside a group's `results`.
  - path: "$.results.*.results.*.label_ids"
    mode: array
    request: "*group_by=labels__id*"
    why: "plane/utils/paginator.py:352 builds the array from list(set(...)); D16 compares it as a multiset"
  - path: "$.results.*.results.*.assignee_ids"
    mode: array
    request: "*group_by=assignees__id*"
    why: "plane/utils/paginator.py:352 builds the array from list(set(...)); D16 compares it as a multiset"
  - path: "$.results.*.results.*.module_ids"
    mode: array
    request: "*group_by=issue_module__module_id*"
    why: "plane/utils/paginator.py:352 builds the array from list(set(...)); D16 compares it as a multiset"
  # Sub-grouped page: group -> sub-group -> the same arrays.
  - path: "$.results.*.results.*.results.*.label_ids"
    mode: array
    request: "*group_by=labels__id*"
    why: "plane/utils/paginator.py:599-605 builds the array from list(set(...)); D16 compares it as a multiset"
  - path: "$.results.*.results.*.results.*.assignee_ids"
    mode: array
    request: "*group_by=assignees__id*"
    why: "plane/utils/paginator.py:599-605 builds the array from list(set(...)); D16 compares it as a multiset"
  - path: "$.results.*.results.*.results.*.module_ids"
    mode: array
    request: "*group_by=issue_module__module_id*"
    why: "plane/utils/paginator.py:599-605 builds the array from list(set(...)); D16 compares it as a multiset"
  # A row that an issue contributes to more than one group is the *same dict*
  # object in Python, appended under every group id (plane/utils/paginator.py:355).
  # Its raw group column therefore keeps whichever of the issue's rows the
  # database returned first — an order neither side's SQL defines (the
  # plane-query README records the same normalisation for its golden corpus).
  # Canonicalise it to the group key the row is filed under; the membership
  # array (`assignee_ids`, …) is still compared, as a multiset.
  - path: "$.results.*.results.*.assignees__id"
    mode: parent_key
    request: "*group_by=assignees__id*"
    why: "the row dict is shared across groups, so its raw group column is a database-order accident (plane/utils/paginator.py:355)"
  - path: "$.results.*.results.*.labels__id"
    mode: parent_key
    request: "*group_by=labels__id*"
    why: "the row dict is shared across groups, so its raw group column is a database-order accident (plane/utils/paginator.py:355)"
  - path: "$.results.*.results.*.issue_module__module_id"
    mode: parent_key
    request: "*group_by=issue_module__module_id*"
    why: "the row dict is shared across groups, so its raw group column is a database-order accident (plane/utils/paginator.py:355)"

  # Sub-grouped pages: the cells of a group are built from
  # `__get_subgroup_total_queryset`, which has no ORDER BY
  # (plane/utils/paginator.py:511-518), so the cell order is the database's.
  - path: "$.results.*.results"
    mode: object_keys
    request: "*sub_group_by=*"
    why: "the sub-group cell order is whatever the unordered subgroup-total query returns (plane/utils/paginator.py:511-518)"
  # `GET /api/workspaces/{slug}/project-stats/` keys every row by
  # `set(filter(None, fields)) & valid_fields`, so the annotation order (and
  # with it the row's key order) follows the process's string hash seed
  # (plane/app/views/analytic/base.py:420-427). The key set and every value are
  # still compared by key.
  - path: "$.*"
    mode: object_keys
    request: "*project-stats*"
    why: "plane/app/views/analytic/base.py:420-427 builds the row keys from set(...) & valid_fields; D16 compares the key set"

  # Single m2m group: the group keys of the response are set order too.
  - path: "$.results"
    mode: object_keys
    request: "*group_by=labels__id*"
    why: "plane/utils/paginator.py:355-365 keys the result dict by list(set(...)); D16 compares the key set, not its order"
  - path: "$.results"
    mode: object_keys
    request: "*group_by=assignees__id*"
    why: "plane/utils/paginator.py:355-365 keys the result dict by list(set(...)); D16 compares the key set, not its order"
  - path: "$.results"
    mode: object_keys
    request: "*group_by=issue_module__module_id*"
    why: "plane/utils/paginator.py:355-365 keys the result dict by list(set(...)); D16 compares the key set, not its order"

  # `ProjectViewSet.list` (`plane/app/views/project/base.py:147-226`) emits
  # `SELECT DISTINCT … GROUP BY p.id` with **no ORDER BY**: the `Count(...)`
  # annotation combined with `distinct()` and `.values()` drops
  # `Project.Meta.ordering`, so PostgreSQL returns hash-aggregate order, which
  # changes when the set of project ids changes. Compare the page as a
  # multiset (the endpoint has no ordering contract).
  - path: "$"
    mode: array
    request: "GET /api/workspaces/*/projects/"
    why: "plane/app/views/project/base.py:147-226 has no ORDER BY (GROUP BY p.id); D16 compares the page as a multiset"

  # The draft create/update response's m2m arrays come from `ArrayAgg` with no
  # `ORDER BY` (`plane/app/views/workspace/draft.py:93-124`); PostgreSQL is free
  # to return the rows in any order. Compare the elements as a multiset, like
  # the paginator's set-derived arrays above.
  - path: "$.assignee_ids"
    mode: array
    request: "POST /api/workspaces/*/draft-issues/"
    why: "plane/app/views/workspace/draft.py:93-124 ArrayAgg has no ORDER BY; the create response's assignee_ids order is undefined"
  - path: "$.label_ids"
    mode: array
    request: "POST /api/workspaces/*/draft-issues/"
    why: "plane/app/views/workspace/draft.py:93-124 ArrayAgg has no ORDER BY; the create response's label_ids order is undefined"
  - path: "$.module_ids"
    mode: array
    request: "POST /api/workspaces/*/draft-issues/"
    why: "plane/app/views/workspace/draft.py:93-124 ArrayAgg has no ORDER BY; the create response's module_ids order is undefined"

volatile_cookies:
  - name: session-id
    placeholder: session
    shape: session_key
    why: "Django session key, 128 random lower-case alphanumeric characters (plane/db/models/session.py)"
  - name: admin-session-id
    placeholder: session
    shape: session_key
    why: "instance-admin session key from the same store, different cookie name (plane/settings/common.py:431)"
  - name: csrftoken
    placeholder: csrf-secret
    shape: csrf_secret
    why: "Django's CSRF cookie is the unmasked 32-character secret, rotated on login (django.middleware.csrf)"

volatile_json_keys:
  - name: csrf_token
    placeholder: csrf-token
    shape: csrf_token
    check: csrf_masked
    why: "get_token() returns a fresh masked token that must unmask to this response's csrftoken cookie (plane/authentication/views/common.py:29)"
  - name: username
    placeholder: username
    shape: uuid_hex
    why: "every new user gets uuid.uuid4().hex as username (plane/authentication/adapter/base.py:352)"
  - name: token
    mode: placeholder_if_non_empty
    placeholder: token
    shape: api_token
    why: "users.token is 64 random hex characters when token_updated_at is set (plane/db/models/user.py:174)"
  - name: background_color
    placeholder: colour
    shape: hex_colour
    why: "random default '#rrggbb' colour, mixed case (plane/utils/color.py:9), used by workspaces and profiles"
  # A label colour is not volatile: a create/PUT/PATCH writes the value the
  # request carried, so it is compared literally everywhere. Only the bulk
  # importer generates one per row (`color=f"#{random.randint(0,
  # 0xFFFFFF + 1):06X}"`, plane/app/views/issue/label.py:111), so the rule is
  # scoped to that request; every other step keeps the literal colour.
  - name: color
    mode: placeholder_if_new
    placeholder: colour
    shape: hex_colour
    request: "POST *bulk-create-labels*"
    why: "BulkCreateIssueLabelsEndpoint generates one random '#rrggbb' colour per imported label (plane/app/views/issue/label.py:111); no other label write invents a colour"
  # DECISIONS.md D16: the same principle as generated ids. A board created
  # during a run gets `uuid4().hex`; the value is random per side, so it is a
  # placeholder that stays consistent across the body, the DB diff and every
  # later step. A board the fixture seeded has an identical anchor on both
  # sides, so `placeholder_if_new` leaves it literal and it is still compared.
  - name: anchor
    mode: placeholder_if_new
    placeholder: anchor
    shape: anchor_hex
    why: "DeployBoard.anchor = uuid4().hex on create (plane/db/models/deploy_board.py:14-15); DECISIONS.md D16"
  - name: asset
    mode: placeholder_if_new
    placeholder: asset
    shape: asset_key
    request: "*api/assets/v2/*attachments*"
    why: "FileAsset.asset = workspace/uuid4().hex-filename (plane/db/models/asset.py:20-25); a fixture key stays literal"
  - name: key
    mode: placeholder_if_new
    placeholder: asset
    shape: asset_key
    request: "POST *api/assets/*"
    why: "presigned POST field `key` is the newly generated FileAsset.asset on every v2 upload (plane/app/views/asset/v2.py:186,406,655 and the issue-attachment upload); legacy uploads 500 before the body is built"
  - name: policy
    placeholder: upload-policy
    shape: upload_policy
    why: "presigned POST policy contains the signing instant (botocore signers.py:723-846)"
  - name: x-amz-signature
    placeholder: upload-signature
    shape: upload_signature
    why: "presigned POST SigV4 signature"
  - name: x-amz-date
    placeholder: upload-date
    shape: upload_date
    why: "presigned POST signing date"
  - name: x-amz-credential
    placeholder: upload-credential
    shape: upload_credential
    why: "presigned POST credential scope"
  - name: epoch
    mode: unix_time
    why: "int(timezone.now().timestamp()) at enqueue time (plane/app/views/issue/base.py:429); two runs can land in different seconds"
  # The archive response re-reads the clock and renders Python `str(datetime)`
  # (page/base.py:332). Scoped to that request: every other `archived_at` key
  # (a PATCH body echo, a list row) is a stored date and stays literal.
  - name: archived_at
    mode: placeholder
    placeholder: naive-datetime
    shape: naive_datetime
    request: "POST /api/workspaces/*/projects/*/pages/*/archive/"
    why: "plane/app/views/page/base.py:332 renders str(datetime.now()) for the archive response"
  # The secret a create/regen response reveals is generated per request
  # (`Webhook.secret_key` default `generate_token`, plane/db/models/webhook.py:38;
  # regenerate at plane/app/views/webhook/base.py:118-119), so two targets never
  # produce the same value. Scoped to the webhook routes: no other response has a
  # `secret_key` key, and a fixture row's value — the same bytes on both sides —
  # is replaced by the same placeholder rather than skipped, so it is still
  # compared.
  - name: secret_key
    mode: placeholder
    placeholder: webhook-secret
    shape: webhook_secret
    request: "*webhooks*"
    why: "generated HMAC secret: 'plane_wh_' + uuid4().hex (plane/db/models/webhook.py:17-18)"
  # `create` calls `generate_random_name()` eagerly and stores it when the body
  # carries no `name` (plane/app/views/estimate/base.py:29-31, :66), so the
  # response's `name` is a different ten-letter word per target. Scoped to the
  # create route: a PATCH echoes the name the request carried, and every other
  # response's `name` is a fixture literal.
  #
  # The scope is the request, not the body: a create step that *does* send
  # `name` still runs this rule, so its literal must also match the generated
  # shape (`^[a-z]{10}$`) or the shape check fails the step. A step that
  # proves an explicit name is written should use such a value (or assert the
  # echo through `PATCH …/estimates/{id}/`, which this rule does not touch).
  - name: name
    mode: placeholder
    placeholder: estimate-name
    shape: estimate_random_name
    request: "POST /api/workspaces/*/projects/*/estimates/"
    why: "generate_random_name() when the create body has no `name` (plane/app/views/estimate/base.py:29-31, :66)"

volatile_db_columns:
  - table: sessions
    column: session_key
    placeholder: session
    shape: session_key
    why: "Django session key: get_random_string(128, ascii_lowercase + digits) (plane/db/models/session.py:36)"
  - table: sessions
    column: session_data
    mode: session_payload
    shape: signed_session
    why: "signed payload; verified with the target's SECRET_KEY, decoded and compared as a dictionary (HTTP_CONTRACT.md §5.3)"
  - table: sessions
    column: expire_date
    mode: relative_time
    why: "start + SESSION_COOKIE_AGE (604800 s); the absolute value differs by the milliseconds between the two requests"
  - table: api_tokens
    column: last_used
    mode: relative_time
    why: "APIKeyAuthentication writes timezone.now() on every successful authentication (plane/api/middleware/api_authentication.py:38-40); the two targets authenticate at their own instants"
  - table: users
    column: username
    placeholder: username
    shape: uuid_hex
    why: "new users are created with uuid.uuid4().hex as username (plane/authentication/adapter/base.py:352)"
  - table: users
    column: password
    mode: password
    shape: django_password_hash
    why: "Django PBKDF2 hash: verified against the scenario's plaintext, algorithm and iteration count still compared (django/contrib/auth/hashers.py:324)"
  - table: users
    column: token
    mode: placeholder_if_non_empty
    placeholder: token
    shape: api_token
    why: "random API token, written when token_updated_at is set (plane/db/models/user.py:174)"
  - table: profiles
    column: background_color
    placeholder: colour
    shape: hex_colour
    why: "random default colour, mixed case (plane/db/models/user.py:254, plane/utils/color.py:9)"
  - table: workspaces
    column: background_color
    placeholder: colour
    shape: hex_colour
    why: "random default colour, mixed case (plane/db/models/workspace.py:139, plane/utils/color.py:9)"
  - table: labels
    column: color
    mode: placeholder_if_new
    placeholder: colour
    shape: hex_colour
    request: "POST *bulk-create-labels*"
    why: "the bulk importer's per-row random colour (plane/app/views/issue/label.py:111); every other label write's colour is compared literally"
  # The DB half of the `anchor` rule above: the same raw value gets the same
  # placeholder from the per-target map, so a generated anchor is `<anchor:1>`
  # in the response body and in `deploy_boards.anchor` of the insert diff.
  - table: deploy_boards
    column: anchor
    mode: placeholder_if_new
    placeholder: anchor
    shape: anchor_hex
    why: "DeployBoard.anchor = uuid4().hex on create (plane/db/models/deploy_board.py:14-15); DECISIONS.md D16"
  - table: file_assets
    column: asset
    mode: placeholder_if_new
    placeholder: asset
    shape: asset_key
    why: "FileAsset.asset = workspace/uuid4().hex-filename (plane/db/models/asset.py:20-25); a fixture key stays literal"
  # The DB half of the `secret_key` rule above: a create's inserted row and a
  # regenerate's column update both carry a freshly generated value, and the
  # same raw value gets the same placeholder in the body and the diff
  # (`plane/db/models/webhook.py:17-18`, `:38`).
  - table: webhooks
    column: secret_key
    mode: placeholder
    placeholder: webhook-secret
    shape: webhook_secret
    request: "*webhooks*"
    why: "Webhook.secret_key = generate_token(): 'plane_wh_' + uuid4().hex (plane/db/models/webhook.py:17-18)"
  # The DB half of the `name` rule above: the INSERT carries the generated
  # name, and the same raw value gets the same placeholder in the response
  # body and in the `estimates` row diff. Scoped to the create route so a
  # PATCH's `name` update stays a literal comparison.
  - table: estimates
    column: name
    mode: placeholder
    placeholder: estimate-name
    shape: estimate_random_name
    request: "POST /api/workspaces/*/projects/*/estimates/"
    why: "generate_random_name() when the create body has no `name` (plane/app/views/estimate/base.py:29-31, :66)"
  # `ExportIssuesEndpoint.post` stores `ExporterHistory.token = uuid4().hex`
  # (plane/db/models/exporter.py:20, plane/app/views/exporter/base.py:50) and
  # publishes the same value as `token_id`. The DB diff is normalised before
  # the Celery message (plane-testkit/src/runner.rs), so this placeholder is
  # then substituted inside `kwargs.token_id` and `kwargsrepr`
  # (normalize.rs::normalize_text → substitute_known). Scoped to the create
  # route: the fixture's exporter tokens are 64 hex
  # (tools/fixtures/build.py:2816), not this shape, and a read step must not
  # try to placeholder them.
  - table: exporters
    column: token
    mode: placeholder
    placeholder: export-token
    shape: uuid_hex
    request: "POST *export-issues*"
    why: "ExporterHistory.token = uuid4().hex on create (plane/db/models/exporter.py:20, plane/app/views/exporter/base.py:50)"

# Celery transport headers: not part of the task's observable behaviour, so
# they are dropped rather than placeholdered (their values are per-process).
volatile_celery_headers:
  - name: id
    mode: drop
    why: "Celery assigns a fresh UUID to every message (celery/app/amqp.py)"
  - name: root_id
    mode: drop
    why: "root task id of the current celery call chain"
  - name: parent_id
    mode: drop
    why: "parent task id of the current celery call chain"
  - name: origin
    mode: drop
    why: "hostname:pid of the publishing process, which differs per gunicorn worker"
