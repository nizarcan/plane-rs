#
# Chart CI fixture: the recommended ArgoCD shape. ArgoCD renders with
# `helm template`, so the chart must not depend on `.Release.Revision`; with an
# external database and an existing database Secret the migrator is a
# `pre-install,pre-upgrade` hook, which ArgoCD translates to PreSync.
secrets:
  app:
    existingSecret: plane-app-secrets
  database:
    existingSecret: plane-database-secrets
  objectStorage:
    existingSecret: plane-object-storage-secrets
database:
  bundled: false
  url: ""
ingress:
  enabled: true
  className: nginx
  host: plane.example.com
  tls:
    enabled: true
    secretName: plane-tls
config:
  webUrl: https://plane.example.com
  corsAllowedOrigins: https://plane.example.com
  numProxies: "1"
