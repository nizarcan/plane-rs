#
# Chart CI fixture: every secret group comes from an existing Secret (the
# External Secrets Operator / Sealed Secrets setup). The bundled datastores
# stay on, so MinIO and PostgreSQL must read the same external Secrets -- the
# PostgreSQL password key and MinIO's root keys are still required.
secrets:
  app:
    existingSecret: plane-app-secrets
  database:
    existingSecret: plane-database-secrets
  objectStorage:
    existingSecret: plane-object-storage-secrets
