# Chart CI fixture: ingress with TLS, an nginx body-size annotation and an
# explicit ingressClassName; WEB_URL is derived from the host.
ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 5m
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
  host: plane.example.com
  tls:
    enabled: true
    secretName: plane-tls
config:
  corsAllowedOrigins: https://plane.example.com
  numProxies: "1"
