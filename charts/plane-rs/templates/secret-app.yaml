{{/* SECRET_KEY and LIVE_SERVER_SECRET_KEY. Both must be stable across upgrades:
SECRET_KEY derives the key that encrypts the instance-configuration rows, and
live verifies the tokens the api signs with it. An existingSecret wins and this
file renders nothing. */}}
{{- if not .Values.secrets.app.existingSecret }}
{{- $secretKey := required "secrets.app.secretKey must not be empty: the api would generate a random key per process and stored instance configuration would be unreadable (or set secrets.app.existingSecret)" .Values.secrets.app.secretKey -}}
{{- $liveKey := required "secrets.app.liveServerSecretKey must not be empty (or set secrets.app.existingSecret)" .Values.secrets.app.liveServerSecretKey -}}
{{- if .Values.secrets.app.requireExplicitSecrets }}
{{- if or (eq $secretKey "change-this-key-on-deployment") (eq $liveKey "change-this-key-on-deployment") }}
{{- fail "secrets.app.requireExplicitSecrets=true: replace secrets.app.secretKey and secrets.app.liveServerSecretKey (openssl rand -hex 32) or set secrets.app.existingSecret" }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "plane-rs.appSecretName" . }}
  labels:
    {{- include "plane-rs.labels" (dict "ctx" $) | nindent 4 }}
type: Opaque
stringData:
  SECRET_KEY: {{ $secretKey | quote }}
  LIVE_SERVER_SECRET_KEY: {{ $liveKey | quote }}
{{- end }}
