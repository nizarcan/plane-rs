{{/* DATABASE_URL and, for the bundled PostgreSQL, POSTGRES_PASSWORD. An
existingSecret wins; it must carry both keys (the second only matters when the
bundled database is enabled). */}}
{{- if not .Values.secrets.database.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "plane-rs.databaseSecretName" . }}
  labels:
    {{- include "plane-rs.labels" (dict "ctx" $) | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ include "plane-rs.databaseUrl" . | quote }}
  POSTGRES_PASSWORD: {{ required "secrets.database.password is required when the chart creates the database Secret" .Values.secrets.database.password | quote }}
{{- end }}
