{{/* S3/MinIO credentials. The same keys are the bundled MinIO's root
credentials (MINIO_ROOT_USER / MINIO_ROOT_PASSWORD). An existingSecret wins,
which is how a cloud workload identity or an ESO-managed credential is wired
in; with no credentials at all the app relies on the AWS SDK's own chain, but
the bundled MinIO cannot start, so the chart requires a value here. */}}
{{- if not .Values.secrets.objectStorage.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "plane-rs.objectStorageSecretName" . }}
  labels:
    {{- include "plane-rs.labels" (dict "ctx" $) | nindent 4 }}
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: {{ required "secrets.objectStorage.accessKey is required when the chart creates the object-storage Secret (or set secrets.objectStorage.existingSecret)" .Values.secrets.objectStorage.accessKey | quote }}
  AWS_SECRET_ACCESS_KEY: {{ required "secrets.objectStorage.secretKey is required when the chart creates the object-storage Secret (or set secrets.objectStorage.existingSecret)" .Values.secrets.objectStorage.secretKey | quote }}
{{- end }}
