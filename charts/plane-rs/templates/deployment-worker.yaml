{{/* No probes: the worker has no HTTP listener and the distroless image has no
shell, so there is nothing for kubelet to exec or GET. A process that loses
Postgres/Redis exits non-zero and the Deployment restarts it; a hung handler is
bounded by PLANE_RS_JOB_LEASE_SECONDS (60), after which the job is redelivered
while the pod keeps running. */}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "plane-rs.componentName" (dict "ctx" $ "component" "worker") }}
  labels:
    {{- include "plane-rs.labels" (dict "ctx" $ "component" "worker") | nindent 4 }}
spec:
  replicas: {{ .Values.worker.replicas }}
  revisionHistoryLimit: 3
  {{- include "plane-rs.strategy" . | nindent 2 }}
  selector:
    matchLabels:
      {{- include "plane-rs.selectorLabels" (dict "ctx" $ "component" "worker") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "plane-rs.selectorLabels" (dict "ctx" $ "component" "worker") | nindent 8 }}
        {{- with .Values.worker.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if not .Values.secrets.app.existingSecret }}
        checksum/secret-app: {{ include (print $.Template.BasePath "/secret-app.yaml") . | sha256sum }}
        {{- end }}
        {{- if not .Values.secrets.database.existingSecret }}
        checksum/secret-database: {{ include (print $.Template.BasePath "/secret-database.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.worker.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "plane-rs.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.worker.podSecurityContext | nindent 8 }}
      {{- include "plane-rs.podScheduling" .Values.worker | nindent 6 }}
      terminationGracePeriodSeconds: {{ .Values.worker.terminationGracePeriodSeconds }}
      containers:
        - name: worker
          image: {{ include "plane-rs.image" (dict "ctx" $ "image" .Values.worker.image) }}
          imagePullPolicy: {{ .Values.worker.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.worker.containerSecurityContext | nindent 12 }}
          envFrom:
            {{- include "plane-rs.backendEnvFrom" . | nindent 12 }}
            {{- with .Values.worker.extraEnvFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.worker.extraEnv }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
