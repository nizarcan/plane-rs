services:
  web:
    image: ${IMAGE_REGISTRY:-ghcr.io/nizarcan}/plane-rs-web:${APP_RELEASE:-latest}
    build:
      context: ../../
      dockerfile: apps/web/Dockerfile.web

  space:
    image: ${IMAGE_REGISTRY:-ghcr.io/nizarcan}/plane-rs-space:${APP_RELEASE:-latest}
    build:
      context: ../../
      dockerfile: apps/space/Dockerfile.space

  admin:
    image: ${IMAGE_REGISTRY:-ghcr.io/nizarcan}/plane-rs-admin:${APP_RELEASE:-latest}
    build:
      context: ../../
      dockerfile: apps/admin/Dockerfile.admin

  live:
    image: ${IMAGE_REGISTRY:-ghcr.io/nizarcan}/plane-rs-live:${APP_RELEASE:-latest}
    build:
      context: ../../
      dockerfile: apps/live/Dockerfile.live

  # Phase 8: the backend roles are the Rust images. Their build context is the
  # repository root (the binaries embed one Django template), and the three
  # `plane-jobs` roles are separate targets of one Dockerfile.
  plane-api:
    image: ${IMAGE_REGISTRY:-ghcr.io/nizarcan}/plane-rs-api:${APP_RELEASE:-latest}
    build:
      context: .
      dockerfile: apps/server/deploy/docker/Dockerfile.plane-api

  plane-worker:
    image: ${IMAGE_REGISTRY:-ghcr.io/nizarcan}/plane-rs-worker:${APP_RELEASE:-latest}
    build:
      context: .
      dockerfile: apps/server/deploy/docker/Dockerfile.plane-jobs
      target: worker

  plane-beat:
    image: ${IMAGE_REGISTRY:-ghcr.io/nizarcan}/plane-rs-beat:${APP_RELEASE:-latest}
    build:
      context: .
      dockerfile: apps/server/deploy/docker/Dockerfile.plane-jobs
      target: beat

  migrator:
    image: ${IMAGE_REGISTRY:-ghcr.io/nizarcan}/plane-rs-migrator:${APP_RELEASE:-latest}
    build:
      context: .
      dockerfile: apps/server/deploy/docker/Dockerfile.plane-jobs
      target: migrator

  proxy:
    image: ${IMAGE_REGISTRY:-ghcr.io/nizarcan}/plane-rs-proxy:${APP_RELEASE:-latest}
    build:
      context: ../../apps/proxy
      dockerfile: Dockerfile.ce
