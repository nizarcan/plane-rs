services:
  web:
    container_name: web
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile.web
      args:
        DOCKER_BUILDKIT: 1
    restart: always
    depends_on:
      - plane-api

  admin:
    container_name: admin
    build:
      context: .
      dockerfile: ./apps/admin/Dockerfile.admin
      args:
        DOCKER_BUILDKIT: 1
    restart: always
    depends_on:
      - plane-api
      - web

  space:
    container_name: space
    build:
      context: .
      dockerfile: ./apps/space/Dockerfile.space
      args:
        DOCKER_BUILDKIT: 1
    restart: always
    depends_on:
      - plane-api
      - web

  # Phase 8 cutover (`apps/server/plans/CUTOVER.md` §5): the four backend
  # services are the Rust binaries. `migrator` owns the Django baseline schema
  # and `plane_jobs`, and every long-running service waits for it to finish
  # successfully before it starts.
  plane-api:
    container_name: plane-api
    build:
      context: .
      dockerfile: apps/server/deploy/docker/Dockerfile.plane-api
      args:
        DOCKER_BUILDKIT: 1
    restart: always
    env_file:
      - ./apps/api/.env
    depends_on:
      plane-db:
        condition: service_started
      plane-redis:
        condition: service_started
      migrator:
        condition: service_completed_successfully

  plane-worker:
    container_name: plane-worker
    build:
      context: .
      dockerfile: apps/server/deploy/docker/Dockerfile.plane-jobs
      target: worker
      args:
        DOCKER_BUILDKIT: 1
    restart: always
    # The worker needs the api's environment: it decrypts the instance
    # configuration with SECRET_KEY and reads DATABASE_URL, REDIS_URL, AWS_*,
    # WEB_URL, LIVE_URL and WEBHOOK_ALLOWED_* for the task handlers.
    env_file:
      - ./apps/api/.env
    depends_on:
      plane-db:
        condition: service_started
      plane-redis:
        condition: service_started
      migrator:
        condition: service_completed_successfully

  plane-beat:
    container_name: plane-beat
    build:
      context: .
      dockerfile: apps/server/deploy/docker/Dockerfile.plane-jobs
      target: beat
      args:
        DOCKER_BUILDKIT: 1
    restart: always
    env_file:
      - ./apps/api/.env
    depends_on:
      plane-db:
        condition: service_started
      plane-redis:
        condition: service_started
      migrator:
        condition: service_completed_successfully

  migrator:
    container_name: plane-migrator
    build:
      context: .
      dockerfile: apps/server/deploy/docker/Dockerfile.plane-jobs
      target: migrator
      args:
        DOCKER_BUILDKIT: 1
    restart: no
    env_file:
      - ./apps/api/.env
    depends_on:
      plane-db:
        condition: service_started
      plane-redis:
        condition: service_started

  live:
    container_name: plane-live
    build:
      context: .
      dockerfile: ./apps/live/Dockerfile.live
      args:
        DOCKER_BUILDKIT: 1
    restart: always

  plane-db:
    container_name: plane-db
    image: postgres:15.7-alpine
    restart: always
    command: postgres -c 'max_connections=1000'
    volumes:
      - pgdata:/var/lib/postgresql/data
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data

  plane-redis:
    container_name: plane-redis
    image: valkey/valkey:7.2.11-alpine
    restart: always
    volumes:
      - redisdata:/data

  plane-minio:
    container_name: plane-minio
    image: docker.io/pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    restart: always
    command: server /export --console-address ":9090"
    volumes:
      - uploads:/export
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY}

  # Comment this if you already have a reverse proxy running
  proxy:
    container_name: proxy
    build:
      context: ./apps/proxy
      dockerfile: Dockerfile.ce
    restart: always
    ports:
      - ${LISTEN_HTTP_PORT}:80
      - ${LISTEN_HTTPS_PORT}:443
    environment:
      FILE_SIZE_LIMIT: ${FILE_SIZE_LIMIT:-5242880}
      BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-uploads}
    depends_on:
      - web
      - plane-api
      - space
      - admin

volumes:
  pgdata:
  redisdata:
  uploads:
